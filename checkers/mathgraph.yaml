version: "0.1.2"
description: |
  **MathGraph** — an experimental independent Lean 4 checker in JavaScript.

  It uses a small explicit semantic core with exact decline boundaries, validated
  single-inductive semantics, quotient rules, projections, proof irrelevance, eta,
  symbolic universes, stack-safe/local-definition fallbacks, and a bounded
  recursor-gated shallow conversion schedule. The Arena runtime is self-contained
  and excludes the developmental search and qualification system used to construct it.

  Unsupported or resource-bounded inputs are declined (exit 2), never guessed.
url: https://github.com/heathsanchez/lean-kernel-arena
ref: mda-kernel-genesis-v1
rev: 416cfb268ffeeda2d782120d169df1e1567d04d5
build: |
  cd checkers/mathgraph
  for f in *.mjs; do node --check "$f"; done
run: node checkers/mathgraph/main.mjs "$IN"
threads: 1
declines: []
