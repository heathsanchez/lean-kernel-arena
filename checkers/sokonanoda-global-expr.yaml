description: |
  RGRS D1: pinned sokonanoda with one representation-only change.
  Before allocating a TcCtx-local expression, probe the persistent ExportFile
  expression DAG and reuse the global ExprPtr when an identical expression exists.
  Evaluation policy and all other mechanisms remain pinned to 0fab887.
url: https://github.com/intgrah/sokonanoda
ref: master
rev: 0fab8874080e379a774a9a27f7538d8a1ddd786b
build: |
  ROOT=$(cd ../../../.. && pwd)
  python3 "$ROOT/scripts/rgrs_patch_global_expr.py" reuse
  cat > config.json <<__END__
   {
     "use_stdin": true,
     "nat_extension": true,
     "string_extension": true,
     "unpermitted_axiom_hard_error": false,
     "unsafe_permit_all_axioms": true,
     "num_threads": 4
   }
  __END__
  "$ROOT/lka.py" build-test init-prelude
  RUSTFLAGS="-C target-cpu=native -Cprofile-generate=$PWD/pgo" cargo build --release
  target/release/sokonanoda config.json < "$ROOT/_build/tests/init-prelude.ndjson" >/dev/null
  llvm-profdata merge -o "$PWD/pgo/merged.profdata" "$PWD/pgo"
  RUSTFLAGS="-C target-cpu=native -Cprofile-use=$PWD/pgo/merged.profdata" cargo build --release
run: |
  target/release/sokonanoda config.json < "$IN" || exit 1
