description: |
  MathGraph A5 decomposition arm: A4 + E0025 Lambda open-eval bypass.
url: https://github.com/intgrah/sokonanoda
ref: master
rev: 9b4ea12f4cd437d00b6bcd0e34743065c58dea08
build: |
  python3 - <<'PY'
  from pathlib import Path
  p=Path('src/tc.rs'); s=p.read_text(); old='const SESSION_BUDGET: usize = 1 << 20;'; assert old in s; p.write_text(s.replace(old,'const SESSION_BUDGET: usize = 2_621_440;',1))
  p=Path('src/eval.rs'); s=p.read_text()
  old='''                let Expr::Lambda { body: inner, .. } = self.ctx.read_expr(body) else { break };
                  let pruned = self.key_env(env, body);
                  env = value::env_extend(self.arena, pruned, args[i]);
                  body = inner;
                  i += 1;
  '''
  new='''                let Expr::Lambda { body: inner, .. } = self.ctx.read_expr(body) else { break };
                  env = value::env_extend(self.arena, env, args[i]);
                  body = inner;
                  i += 1;
  '''
  assert old in s; s=s.replace(old,new,1)
  old='''        if matches!(
              self.ctx.read_expr_ref(e),
              Expr::App { .. } | Expr::Proj { .. } | Expr::Let { .. } | Expr::Pi { .. } | Expr::Lambda { .. }
          ) {
  '''
  new='''        if matches!(
              self.ctx.read_expr_ref(e),
              Expr::Proj { .. } | Expr::Let { .. } | Expr::Pi { .. } | Expr::Lambda { .. }
          ) {
  '''
  assert old in s; s=s.replace(old,new,1)
  old='''        if matches!(
              self.ctx.read_expr_ref(e),
              Expr::Proj { .. } | Expr::Let { .. } | Expr::Pi { .. } | Expr::Lambda { .. }
          ) {
  '''
  new='''        if matches!(
              self.ctx.read_expr_ref(e),
              Expr::Proj { .. } | Expr::Let { .. } | Expr::Pi { .. }
          ) {
  '''
  assert old in s; p.write_text(s.replace(old,new,1))
  PY
  cat > config.json <<__END__
   {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":4}
  __END__
  ROOT=$(cd ../../../.. && pwd)
  "$ROOT/lka.py" build-test init-prelude
  RUSTFLAGS="-C target-cpu=native -Cprofile-generate=$PWD/pgo" cargo build --release
  target/release/sokonanoda config.json < "$ROOT/_build/tests/init-prelude.ndjson" >/dev/null
  llvm-profdata merge -o "$PWD/pgo/merged.profdata" "$PWD/pgo"
  RUSTFLAGS="-C target-cpu=native -Cprofile-use=$PWD/pgo/merged.profdata" cargo build --release
run: |
  target/release/sokonanoda config.json < "$IN" || exit 1
