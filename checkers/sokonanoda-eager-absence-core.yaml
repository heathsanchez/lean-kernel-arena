description: |
  RGRS causal arm A3: retain 9b4ea12 structural absence / ignorable-argument machinery,
  restore the pinned eval.rs implementation, then keep arg_value eager. This isolates the
  structural-observability + eager interaction from the remaining eval.rs deletions.
url: https://github.com/intgrah/sokonanoda
ref: master
rev: 9b4ea12f4cd437d00b6bcd0e34743065c58dea08
build: |
  git checkout 0fab8874080e379a774a9a27f7538d8a1ddd786b -- src/eval.rs
  python3 - <<'PY'
  from pathlib import Path
  p = Path('src/infer.rs')
  s = p.read_text()
  eager = '''    pub(crate) fn arg_value(&mut self, depth: u32, env: E<'t>, a: ExprPtr<'t>) -> V<'t> {
          self.eval(depth, env, a)
      }
  '''
  assert eager in s, 'latest eager arg_value form not found'
  print('RGRS A3: structural absence + eager arg_value with pinned eval.rs')
  PY
  cat > config.json <<__END__
   {
     "use_stdin": true,
     "nat_extension": true,
     "string_extension": true,
     "unpermitted_axiom_hard_error": false,
     "unsafe_permit_all_axioms": true,
     "num_threads": 4
   }
  __END__
  ROOT=$(cd ../../../.. && pwd)
  "$ROOT/lka.py" build-test init-prelude
  RUSTFLAGS="-C target-cpu=native -Cprofile-generate=$PWD/pgo" cargo build --release
  target/release/sokonanoda config.json < "$ROOT/_build/tests/init-prelude.ndjson" >/dev/null
  llvm-profdata merge -o "$PWD/pgo/merged.profdata" "$PWD/pgo"
  RUSTFLAGS="-C target-cpu=native -Cprofile-use=$PWD/pgo/merged.profdata" cargo build --release
run: |
  target/release/sokonanoda config.json < "$IN" || exit 1
