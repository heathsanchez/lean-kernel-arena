name: MDA pair beta WHNF scout
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/pair-beta-whnf-scout.mjs'
      - '.github/workflows/mda-pair-beta-whnf-scout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 20s node genesis/test.mjs
      - name: Run pair beta WHNF scout
        run: timeout 420s node experiments/pair-beta-whnf-scout.mjs
