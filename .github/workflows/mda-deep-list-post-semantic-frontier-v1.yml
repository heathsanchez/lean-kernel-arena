name: Lean deep-list post semantic frontier V1

on:
  push:
    branches: [mda-deep-list-post-semantic-frontier-v1]
    paths:
      - 'genesis/deep-list-post-semantic-frontier-v1.mjs'
      - '.github/workflows/mda-deep-list-post-semantic-frontier-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Protect core regressions
        run: |
          node genesis/test.mjs
          node --test genesis/*.test.mjs

      - name: Retrieve current public Arena corpus
        run: |
          mkdir -p _build/tests
          curl --fail --location --retry 3 https://arena.lean-lang.org/lean-arena-tests.tar.gz -o /tmp/arena.tar.gz
          python3 - <<'PY'
          import tarfile,pathlib,json,hashlib
          root=pathlib.Path('_build/tests')
          rows=[]
          with tarfile.open('/tmp/arena.tar.gz','r:gz') as archive:
              for m in archive:
                  if not m.isfile() or not m.name.endswith('.ndjson'): continue
                  parts=pathlib.PurePosixPath(m.name).parts
                  group=next((i for i,x in enumerate(parts) if x in ('good','bad')),None)
                  if group is None: continue
                  name=pathlib.PurePosixPath(*parts[group+1:])
                  if name.is_absolute() or '..' in name.parts: raise ValueError(m.name)
                  data=archive.extractfile(m).read()
                  path=root/name
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(data)
                  rows.append(dict(name=str(name),expected='ACCEPT' if parts[group]=='good' else 'REJECT',bytes=len(data),sha256=hashlib.sha256(data).hexdigest()))
          (root/'manifest.json').write_text(json.dumps(rows,indent=2))
          print('ARENA_CASES='+str(len(rows)))
          PY

      - name: Profile post-semantic deep-list frontiers
        run: |
          node --stack-size=32768 genesis/deep-list-post-semantic-frontier-v1.mjs             | tee /tmp/deep-list-post-semantic-frontier-v1.log
          grep -q PASS_DEEP_LIST_POST_SEMANTIC_FRONTIER_V1             /tmp/deep-list-post-semantic-frontier-v1.log

      - name: Gate profile evidence
        run: |
          python3 - <<'PY'
          import json
          p='genesis/evidence/deep-list-post-semantic-frontier-v1.json'
          r=json.load(open(p))
          assert r['schema']=='deep-list-post-semantic-frontier-v1'
          assert all(r['gates'].values()), r['gates']
          assert len(r['rows'])==2
          assert all(x['attempts'][-1]['status']=='UNKNOWN' for x in r['rows'])
          assert all(x['attempts'][-1]['budget']==4_000_000 for x in r['rows'])
          assert r['terminal_frontiers'][0]==r['terminal_frontiers'][1]
          print('PASS_DEEP_LIST_POST_SEMANTIC_FRONTIER_V1')
          print('COMMON_FRONTIER='+str(r['terminal_frontiers'][0]))
          for row in r['rows']:
              print(row['name'], row['attempts'][-1]['top_declaration_ticks'][:5])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-deep-list-post-semantic-frontier-v1
          path: |
            genesis/evidence/deep-list-post-semantic-frontier-v1.json
            /tmp/deep-list-post-semantic-frontier-v1.log
          if-no-files-found: error
