name: MDA pair LocalDef normal keys
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/pair-localdef-normal.mjs'
      - '.github/workflows/mda-pair-localdef-normal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  separate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 20s node genesis/test.mjs
      - name: Test semantic LocalDef normal context keys
        run: timeout 660s node experiments/pair-localdef-normal.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pair-localdef-normal-${{ github.sha }}
          path: genesis/evidence/pair-localdef-normal.json
          if-no-files-found: warn
