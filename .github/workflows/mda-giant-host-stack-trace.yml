name: MDA giant host-stack trace
on:
  push:
    branches: [mda-arena-qualification-v1]
    paths:
      - 'genesis/giant-host-stack-trace.mjs'
      - '.github/workflows/mda-giant-host-stack-trace.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Retrieve frozen giant witnesses
        run: |
          mkdir -p _build/tests/perf
          curl --fail --location --retry 3 https://arena.lean-lang.org/lean-arena-tests.tar.gz -o /tmp/arena.tar.gz
          python3 - <<'PY'
          import tarfile,pathlib
          wanted={'init-prelude.ndjson','perf/grind-ring-5.ndjson'}
          root=pathlib.Path('_build/tests');found=set()
          with tarfile.open('/tmp/arena.tar.gz','r:gz') as archive:
              for m in archive:
                  if not m.isfile() or not m.name.endswith('.ndjson'): continue
                  parts=pathlib.PurePosixPath(m.name).parts
                  group=next((i for i,x in enumerate(parts) if x in ('good','bad')),None)
                  if group is None: continue
                  name=str(pathlib.PurePosixPath(*parts[group+1:]))
                  if name not in wanted: continue
                  data=archive.extractfile(m).read();path=root/name
                  path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data);found.add(name)
          missing=wanted-found
          if missing: raise SystemExit('missing witnesses: '+repr(sorted(missing)))
          PY
      - name: Expose retained host-stack trace
        run: node --stack-size=984 genesis/giant-host-stack-trace.mjs
