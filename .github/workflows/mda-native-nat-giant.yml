name: MDA native Nat giant focus

on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'genesis/native-nat-reduction-layer.mjs'
      - 'genesis/native-nat-separator.mjs'
      - 'experiments/ctoridx-shape.mjs'
      - '.github/workflows/mda-native-nat-giant.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focus:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Restore giant witnesses
        uses: actions/cache/restore@v4
        with:
          path: |
            _build/tests/init-prelude.ndjson
            _build/tests/perf/grind-ring-5.ndjson
            _build/tests/perf/shared-subterm.ndjson
          key: giant-frontier-e00d4ce4fb0fa667f632e624adbbc2e6a42704db0556aaf2f154e50f6e450aca
          fail-on-cache-miss: true
      - name: Inspect ctorIdx shape
        run: node experiments/ctoridx-shape.mjs
      - name: Run native Nat separator
        env:
          MATHGRAPH_INPUT_BYTE_LIMIT: "15000000"
          MATHGRAPH_RECORD_LIMIT: "250000"
        run: node --stack-size=32768 genesis/native-nat-separator.mjs
