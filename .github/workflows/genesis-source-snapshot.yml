name: Genesis source snapshot
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths: [.github/workflows/genesis-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-artifact@v4
        with:
          name: genesis-source-${{ github.sha }}
          path: |
            genesis/kernel.mjs
            genesis/test.mjs
            genesis/arena.mjs
          retention-days: 1
