name: MDA exact scoped beta spine
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/multi-beta-exact-scoped-spine.mjs'
      - '.github/workflows/mda-exact-scoped-beta-spine.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  separator:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 20s node genesis/test.mjs
      - name: Test exact-scoped beta continuation
        run: timeout 420s node experiments/multi-beta-exact-scoped-spine.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-scoped-beta-spine-${{ github.sha }}
          path: genesis/evidence/multi-beta-exact-scoped-spine.json
          if-no-files-found: ignore
          retention-days: 7
