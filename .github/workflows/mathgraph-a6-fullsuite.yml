name: MathGraph A6 full-suite gate
on:
  workflow_dispatch:
  push:
    branches: [mathgraph-a6-fullsuite]
    paths:
      - .github/workflows/mathgraph-a6-fullsuite.yml
jobs:
  a6-fullsuite:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: System info
        run: |
          uname -a
          nproc
          free -h
      - name: Build major workloads
        shell: nix develop -c bash -euxo pipefail {0}
        run: |
          for t in cedar cslib mathlib init-prelude; do
            ./lka.py build-test "$t"
          done
      - name: Build pinned sokonanoda
        shell: nix develop -c bash -euxo pipefail {0}
        run: ./lka.py build-checker sokonanoda
      - name: Build retained MathGraph A6
        shell: nix develop -c bash -euxo pipefail {0}
        run: ./lka.py build-checker mathgraph-kernel
      - name: Same-runner major-suite comparison
        shell: nix develop -c bash -euxo pipefail {0}
        run: |
          for t in cedar cslib mathlib init-prelude; do
            echo "===== $t :: pinned ====="
            /usr/bin/time -v ./lka.py run --checker sokonanoda --test "$t"
            echo "===== $t :: A6 ====="
            /usr/bin/time -v ./lka.py run --checker mathgraph-kernel --test "$t"
          done
      - name: Build semantic battery
        shell: nix develop -c bash -euxo pipefail {0}
        run: |
          for t in bogus1 constlevels ctor-num-fields init init-prelude; do
            ./lka.py build-test "$t"
          done
      - name: A6 semantic battery
        shell: nix develop -c bash -euxo pipefail {0}
        run: |
          set +e
          for t in bogus1 constlevels ctor-num-fields; do
            echo "===== A6 expected reject: $t ====="
            ./lka.py run --checker mathgraph-kernel --test "$t"
          done
          for t in init init-prelude; do
            echo "===== A6 expected accept: $t ====="
            ./lka.py run --checker mathgraph-kernel --test "$t"
          done
          exit 0
