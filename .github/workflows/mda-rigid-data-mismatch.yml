name: MDA rigid data mismatch
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/rigid-data-mismatch.mjs'
      - '.github/workflows/mda-rigid-data-mismatch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  separate:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 15s node genesis/test.mjs
      - name: Test certified cheap constructor disagreement
        run: timeout 150s node experiments/rigid-data-mismatch.mjs
      - name: Preserve separator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mda-rigid-data-mismatch-${{ github.sha }}
          path: genesis/evidence/rigid-data-mismatch.json
          if-no-files-found: warn
