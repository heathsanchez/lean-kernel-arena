name: MDA native closure WHNF
on:
  push:
    branches: [mda-native-closure-whnf-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  red-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Native closure focused test
        run: node --test genesis/native-closure-whnf.test.mjs
      - name: Existing semantic regression suite
        run: |
          node genesis/test.mjs
          node --test genesis/*.test.mjs
