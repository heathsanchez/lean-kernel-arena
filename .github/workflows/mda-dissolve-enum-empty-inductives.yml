name: MDA dissolve enum and empty inductives
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/minimal-semantic-kernel-dissolve-enum-empty-v1.mjs'
      - '.github/workflows/mda-dissolve-enum-empty-inductives.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 20s node genesis/test.mjs
      - name: Compare combined enum and empty dissolution
        run: timeout 540s node experiments/minimal-semantic-kernel-dissolve-enum-empty-v1.mjs
