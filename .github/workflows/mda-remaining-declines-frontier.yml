name: MDA remaining declines frontier

on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'genesis/remaining-declines-frontier.mjs'
      - 'genesis/giant-inductive-envelope-census.mjs'
      - 'genesis/kernel-base.mjs'
      - 'experiments/parserdescr-envelope.mjs'
      - 'genesis/nested-envelope.mjs'
      - 'genesis/projection-congruence-recovery.mjs'
      - 'genesis/kernel.mjs'
      - 'genesis/giant-exact-whnf-separator.mjs'
      - 'genesis/giant-whnf-head-profile.mjs'
      - 'genesis/exact-whnf-cache-layer.mjs'
      - '.github/workflows/mda-remaining-declines-frontier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconstruct retained present
        run: timeout 30s node --stack-size=32768 genesis/test.mjs
      - name: Restore giant witnesses
        id: giant-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            _build/tests/init-prelude.ndjson
            _build/tests/perf/grind-ring-5.ndjson
            _build/tests/perf/shared-subterm.ndjson
          key: giant-frontier-${{ hashFiles('tests/init_prelude_module.lean', 'tests/perf/grind-ring-5.lean', 'tests/perf/shared-subterm.lean') }}
      - name: Build remaining decline witnesses
        if: steps.giant-cache.outputs.cache-hit != 'true'
        shell: 'nix develop -c bash -euxo pipefail {0}'
        run: |
          ./lka.py build-test init-prelude
          ./lka.py build-test perf/grind-ring-5
          ./lka.py build-test perf/shared-subterm
      - name: Save giant witnesses
        if: steps.giant-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            _build/tests/init-prelude.ndjson
            _build/tests/perf/grind-ring-5.ndjson
            _build/tests/perf/shared-subterm.ndjson
          key: giant-frontier-${{ hashFiles('tests/init_prelude_module.lean', 'tests/perf/grind-ring-5.lean', 'tests/perf/shared-subterm.lean') }}
      - name: Census giant inductive envelope
        run: node genesis/giant-inductive-envelope-census.mjs
      - name: Inspect ParserDescr envelope
        run: node experiments/parserdescr-envelope.mjs
      - name: Diagnose current frontier
        env:
          MATHGRAPH_INPUT_BYTE_LIMIT: "15000000"
          MATHGRAPH_RECORD_LIMIT: "250000"
        run: timeout 300s node --stack-size=32768 genesis/remaining-declines-frontier.mjs
      - name: Test exact WHNF consequence on giants
        env:
          MATHGRAPH_INPUT_BYTE_LIMIT: "15000000"
          MATHGRAPH_RECORD_LIMIT: "250000"
        run: timeout 120s node --stack-size=32768 genesis/giant-exact-whnf-separator.mjs
      - name: Profile giant WHNF heads
        env:
          MATHGRAPH_INPUT_BYTE_LIMIT: "15000000"
          MATHGRAPH_RECORD_LIMIT: "250000"
        run: timeout 120s node --stack-size=32768 genesis/giant-whnf-head-profile.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remaining-declines-frontier-${{ github.sha }}
          path: genesis/evidence/remaining-declines-current-frontier.json
          if-no-files-found: error
