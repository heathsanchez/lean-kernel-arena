name: MDA remaining declines frontier
# Qualification-branch giant residual census

on:
  push:
    branches: [mda-arena-qualification-v1]
    paths:
      - 'genesis/remaining-declines-frontier.mjs'
      - 'genesis/giant-inductive-envelope-census.mjs'
      - 'genesis/kernel-base.mjs'
      - 'genesis/structural-normal-cache-layer.mjs'
      - 'genesis/structural-normal-separator.mjs'
      - 'genesis/native-nat-reduction-layer.mjs'
      - 'genesis/native-nat-separator.mjs'
      - 'experiments/parserdescr-envelope.mjs'
      - 'experiments/giant-hot-decl-shapes.mjs'
      - 'genesis/nested-envelope.mjs'
      - 'genesis/projection-congruence-recovery.mjs'
      - 'genesis/kernel.mjs'
      - 'genesis/giant-exact-whnf-separator.mjs'
      - 'genesis/giant-le-prefix-profile.mjs'
      - 'genesis/giant-whnf-head-profile.mjs'
      - 'genesis/giant-conversion-pair-profile.mjs'
      - 'genesis/exact-whnf-cache-layer.mjs'
      - 'genesis/structural-whnf-cache-layer.mjs'
      - 'genesis/structural-whnf-separator.mjs'
      - 'genesis/kernel-structural-whnf-order.mjs'
      - 'genesis/structural-whnf-order-separator.mjs'
      - '.github/workflows/mda-remaining-declines-frontier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconstruct retained present
        run: timeout 30s node --stack-size=32768 genesis/test.mjs
      - name: Restore giant witnesses
        id: giant-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            _build/tests/init-prelude.ndjson
            _build/tests/perf/grind-ring-5.ndjson
            _build/tests/perf/shared-subterm.ndjson
          key: giant-frontier-${{ hashFiles('tests/init_prelude_module.lean', 'tests/perf/grind-ring-5.lean', 'tests/perf/shared-subterm.lean') }}
      - name: Build remaining decline witnesses
        if: steps.giant-cache.outputs.cache-hit != 'true'
        shell: 'nix develop -c bash -euxo pipefail {0}'
        run: |
          ./lka.py build-test init-prelude
          ./lka.py build-test perf/grind-ring-5
          ./lka.py build-test perf/shared-subterm
      - name: Save giant witnesses
        if: steps.giant-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            _build/tests/init-prelude.ndjson
            _build/tests/perf/grind-ring-5.ndjson
            _build/tests/perf/shared-subterm.ndjson
          key: giant-frontier-${{ hashFiles('tests/init_prelude_module.lean', 'tests/perf/grind-ring-5.lean', 'tests/perf/shared-subterm.lean') }}
      - name: Census giant inductive envelope
        run: node genesis/giant-inductive-envelope-census.mjs
      - name: Inspect ParserDescr envelope
        run: node experiments/parserdescr-envelope.mjs
      - name: Inspect giant hotspot declarations
        run: node experiments/giant-hot-decl-shapes.mjs
      - name: Diagnose current frontier
        env:
          MATHGRAPH_INPUT_BYTE_LIMIT: "15000000"
          MATHGRAPH_RECORD_LIMIT: "250000"
        run: timeout 300s node --stack-size=32768 genesis/remaining-declines-frontier.mjs
      - name: Test exact WHNF consequence on giants
        env:
          MATHGRAPH_INPUT_BYTE_LIMIT: "15000000"
          MATHGRAPH_RECORD_LIMIT: "250000"
        run: timeout 120s node --stack-size=32768 genesis/giant-exact-whnf-separator.mjs
      - name: Test structural WHNF below retained wrappers
        env:
          MATHGRAPH_INPUT_BYTE_LIMIT: "15000000"
          MATHGRAPH_RECORD_LIMIT: "250000"
        run: timeout 180s node --stack-size=32768 genesis/structural-whnf-order-separator.mjs
      - name: Profile exact giant conversion pair
        env:
          MATHGRAPH_INPUT_BYTE_LIMIT: "15000000"
          MATHGRAPH_RECORD_LIMIT: "250000"
        run: timeout 180s node --stack-size=32768 genesis/giant-conversion-pair-profile.mjs
      - name: Test exact structural WHNF consequence
        env:
          MATHGRAPH_INPUT_BYTE_LIMIT: "15000000"
          MATHGRAPH_RECORD_LIMIT: "250000"
        run: timeout 180s node --stack-size=32768 genesis/structural-whnf-separator.mjs
      - name: Measure LE.le structural prefix reuse
        env:
          MATHGRAPH_INPUT_BYTE_LIMIT: "15000000"
          MATHGRAPH_RECORD_LIMIT: "250000"
        run: timeout 120s node --stack-size=32768 genesis/giant-le-prefix-profile.mjs
      - name: Profile giant WHNF heads
        env:
          MATHGRAPH_INPUT_BYTE_LIMIT: "15000000"
          MATHGRAPH_RECORD_LIMIT: "250000"
        run: timeout 120s node --stack-size=32768 genesis/giant-whnf-head-profile.mjs
      - name: Test structural normal consequence on giants
        env:
          MATHGRAPH_INPUT_BYTE_LIMIT: "15000000"
          MATHGRAPH_RECORD_LIMIT: "250000"
        run: timeout 180s node --stack-size=32768 genesis/structural-normal-separator.mjs
      - name: Test native Nat reductions on giants
        env:
          MATHGRAPH_INPUT_BYTE_LIMIT: "15000000"
          MATHGRAPH_RECORD_LIMIT: "250000"
        run: timeout 180s node --stack-size=32768 genesis/native-nat-separator.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remaining-declines-frontier-${{ github.sha }}
          path: genesis/evidence/remaining-declines-current-frontier.json
          if-no-files-found: error
