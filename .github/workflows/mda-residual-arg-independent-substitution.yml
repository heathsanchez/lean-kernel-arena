name: MDA residual binder-independent substitution
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/residual-arg-independent-substitution.mjs'
      - '.github/workflows/mda-residual-arg-independent-substitution.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  separate:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 20s node genesis/test.mjs
      - name: Test residual binder-independent substitution
        run: timeout 300s node experiments/residual-arg-independent-substitution.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: residual-arg-independent-substitution-${{ github.sha }}
          path: genesis/evidence/residual-arg-independent-substitution.json
          if-no-files-found: warn
