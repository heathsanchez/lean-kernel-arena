name: MDA structural proof-irrelevance cycle guard v2
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/pair-structural-pi-cycle-guard.mjs'
      - '.github/workflows/mda-pair-structural-pi-cycle-guard-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 20s node genesis/test.mjs
      - name: Test structural proof-classification cycle guard
        run: timeout 660s node experiments/pair-structural-pi-cycle-guard.mjs
