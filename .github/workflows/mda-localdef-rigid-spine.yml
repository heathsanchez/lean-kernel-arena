name: MDA LocalDef rigid spine
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/localdef-rigid-spine.mjs'
      - '.github/workflows/mda-localdef-rigid-spine.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  separator:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 20s node genesis/test.mjs
      - name: Test LocalDef rigid spine
        run: timeout 540s node experiments/localdef-rigid-spine.mjs
