name: MDA post semantics giant hotspot
on:
  push:
    branches:
      - mda-kernel-genesis-v1
    paths:
      - experiments/post-semantics-giant-hotspot.mjs
      - .github/workflows/mda-post-semantics-giant-hotspot.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Build giants
        shell: 'nix develop -c bash -euxo pipefail {0}'
        run: |
          ./lka.py build-test init-prelude
          ./lka.py build-test perf/grind-ring-5
      - name: Prepare nested parser candidate
        run: node experiments/make-zero-param-nested-parser-candidate.mjs
      - name: Add arbitrary precision Nat candidate
        run: node experiments/make-arbitrary-nat-candidate.mjs
      - name: Expose optParam constructor annotations
        run: node experiments/make-optparam-field-domain-candidate.mjs
      - name: Profile post-semantics giant streams
        run: timeout 240s node --stack-size=32768 experiments/post-semantics-giant-hotspot.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-semantics-giant-hotspot-evidence
          path: genesis/evidence/post-semantics-giant-hotspot.json
          if-no-files-found: error
