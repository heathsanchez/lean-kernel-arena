name: MDA shared-subterm lazy-delta cap 950k
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'genesis/lazy-delta.mjs'
      - 'genesis/shared-subterm-lazy-delta-cap.mjs'
      - '.github/workflows/mda-shared-subterm-lazy-delta-cap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconstruct retained present
        run: timeout 30s node --stack-size=32768 genesis/test.mjs
      - name: Build shared-subterm
        shell: 'nix develop -c bash -euxo pipefail {0}'
        run: ./lka.py build-test perf/shared-subterm
      - name: Test widened lazy-delta transaction
        run: timeout 120s node --stack-size=32768 genesis/shared-subterm-lazy-delta-cap.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-subterm-lazy-delta-cap-${{ github.sha }}
          path: genesis/evidence/shared-subterm-lazy-delta-cap-950k.json
          if-no-files-found: error
