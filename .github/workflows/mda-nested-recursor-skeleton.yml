name: MDA nested recursor skeleton
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/nested-recursor-skeleton.mjs'
      - '.github/workflows/mda-nested-recursor-skeleton.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build init-prelude
        shell: 'nix develop -c bash -euxo pipefail {0}'
        run: ./lka.py build-test init-prelude
      - name: Decode nested recursor
        run: node experiments/nested-recursor-skeleton.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nested-recursor-skeleton-${{ github.sha }}
          path: genesis/evidence/nested-recursor-skeleton.json
          if-no-files-found: error
