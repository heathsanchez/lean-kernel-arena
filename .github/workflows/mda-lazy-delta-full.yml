name: MDA lazy delta full replay
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/lazy-delta-full.mjs'
      - '.github/workflows/mda-lazy-delta-full.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 15s node genesis/test.mjs
      - name: Replay lazy delta policy
        run: timeout 150s node experiments/lazy-delta-full.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mda-lazy-delta-full-${{ github.sha }}
          path: genesis/evidence/lazy-delta-full.json
          if-no-files-found: warn
