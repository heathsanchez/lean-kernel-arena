name: MDA WHNF consequence separator
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/whnf-consequence-separator.mjs'
      - '.github/workflows/mda-whnf-consequence-separator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  separator:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 20s node genesis/test.mjs
      - name: Run exact WHNF consequence separator
        run: timeout 420s node experiments/whnf-consequence-separator.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mda-whnf-consequence-${{ github.sha }}
          path: genesis/evidence/whnf-consequence-separator.json
          if-no-files-found: error
          retention-days: 7
