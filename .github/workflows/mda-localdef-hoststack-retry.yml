name: MDA LocalDef host-stack retry
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/localdef-hoststack-retry.mjs'
      - '.github/workflows/mda-localdef-hoststack-retry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  separate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 15s node genesis/test.mjs
      - name: Test selective LocalDef host-stack retry
        run: timeout 240s node experiments/localdef-hoststack-retry.mjs
      - name: Preserve separator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mda-localdef-hoststack-retry-${{ github.sha }}
          path: genesis/evidence/localdef-hoststack-retry.json
          if-no-files-found: warn
