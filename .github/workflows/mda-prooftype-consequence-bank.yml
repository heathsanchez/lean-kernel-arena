name: MDA proofType consequence bank
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/prooftype-consequence-bank.mjs'
      - '.github/workflows/mda-prooftype-consequence-bank.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  separate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 20s node genesis/test.mjs
      - name: Test proof classification consequence bank
        run: timeout 540s node experiments/prooftype-consequence-bank.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prooftype-consequence-bank-${{ github.sha }}
          path: genesis/evidence/prooftype-consequence-bank.json
          if-no-files-found: warn
