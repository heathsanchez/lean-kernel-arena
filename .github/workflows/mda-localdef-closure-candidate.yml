name: MDA recurrent localdef closure
on:
  push:
    branches: [mda-localdef-closure-v1]
    paths:
      - 'genesis/native-localdef-closure.test.mjs'
      - 'genesis/native-localdef-closure-layer.mjs'
      - '.github/workflows/mda-localdef-closure-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  red-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Recurrent localdef closure tests
        run: node --test genesis/native-localdef-closure.test.mjs
      - name: Existing semantic regression suite
        run: |
          node genesis/test.mjs
          node --test genesis/*.test.mjs
