name: MDA creative conversion full protected replay

on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'genesis/creative-conversion-full-replay.mjs'
      - '.github/workflows/mda-creative-conversion-full-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconstruct retained present
        run: timeout 30s node --stack-size=32768 genesis/test.mjs
      - name: Build complete CI Arena set including creative witnesses
        shell: 'nix develop -c bash -euxo pipefail {0}'
        run: ./lka.py build-test --skip-ci
      - name: Replay baseline and candidate
        run: timeout 600s node --stack-size=32768 genesis/creative-conversion-full-replay.mjs
      - name: Preserve replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creative-conversion-full-replay-${{ github.sha }}
          path: genesis/evidence/creative-conversion-full-replay.json
          if-no-files-found: error
