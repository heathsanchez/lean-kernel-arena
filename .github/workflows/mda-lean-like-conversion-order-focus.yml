name: MDA Lean-like conversion order focus

on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'genesis/lean-like-conversion-order-focus.mjs'
      - '.github/workflows/mda-lean-like-conversion-order-focus.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focus:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconstruct retained present
        run: timeout 30s node --stack-size=32768 genesis/test.mjs
      - name: Build creative conversion boundary witnesses
        shell: 'nix develop -c bash -euxo pipefail {0}'
        run: |
          ./lka.py build-test undecidability/alg-conv-trans-acc-left
          ./lka.py build-test undecidability/alg-conv-trans-acc-right
          ./lka.py build-test undecidability/subject-reduction-redex
          ./lka.py build-test undecidability/alg-conv-trans-acc
          ./lka.py build-test undecidability/subject-reduction-reduct
      - name: Test narrow Lean-like conversion schedule
        run: timeout 180s node --stack-size=32768 genesis/lean-like-conversion-order-focus.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-like-conversion-order-focus-${{ github.sha }}
          path: genesis/evidence/lean-like-conversion-order-focus.json
          if-no-files-found: error
