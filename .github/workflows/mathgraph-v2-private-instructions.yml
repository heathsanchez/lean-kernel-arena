name: MathGraph V2 private instruction proxy

on:
  push:
    branches: [mathgraph-v2-private-instructions]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mathgraph-v2-private-instructions
  cancel-in-progress: true

jobs:
  score:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout control branch
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install deterministic instruction counter
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          valgrind --version

      - name: Clone and pin official Arena revision
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/leanprover/lean-kernel-arena /tmp/arena
          cd /tmp/arena
          git checkout 73cb14f23f8e3c2a325557a4a2ee0aa9bf5d44f3
          test "$(git rev-parse HEAD)" = "73cb14f23f8e3c2a325557a4a2ee0aa9bf5d44f3"

      - name: Define frozen public and jump32 checkers
        shell: bash
        working-directory: /tmp/arena
        run: |
          set -euxo pipefail
          cat > checkers/mathgraph-public.yaml <<'EOF'
          description: "Frozen published MathGraph checker for private V2 instruction proxy."
          url: https://github.com/metalogiclabs/mathgraph-lean-kernel
          ref: mathgraph
          rev: 1e209dad266d59b4d43cdea189876bc6ea551339
          build: |
            cat > config.json <<__END__
             {
               "use_stdin": true,
               "nat_extension": true,
               "string_extension": true,
               "unpermitted_axiom_hard_error": false,
               "unsafe_permit_all_axioms": true,
               "num_threads": 4
             }
            __END__
            ROOT=$(cd ../../../.. && pwd)
            "$ROOT/lka.py" build-test init-prelude
            RUSTFLAGS="-C target-cpu=native -Cprofile-generate=$PWD/pgo" cargo build --release
            target/release/sokonanoda config.json < "$ROOT/_build/tests/init-prelude.ndjson" >/dev/null
            llvm-profdata merge -o "$PWD/pgo/merged.profdata" "$PWD/pgo"
            RUSTFLAGS="-C target-cpu=native -Cprofile-use=$PWD/pgo/merged.profdata" cargo build --release
          run: |
            target/release/sokonanoda config.json < "$IN" || exit 1
          EOF

          cat > checkers/mathgraph-jump32.yaml <<'EOF'
          description: "Frozen V2 candidate: published MathGraph plus only jump32 environment navigation."
          url: https://github.com/metalogiclabs/mathgraph-lean-kernel
          ref: mathgraph-v2-cost-separator
          rev: cbd3d0902ae59fe0e38e7e40619355cb16290fa7
          build: |
            python3 scripts/v2_jump_patch.py . 32
            cat > config.json <<__END__
             {
               "use_stdin": true,
               "nat_extension": true,
               "string_extension": true,
               "unpermitted_axiom_hard_error": false,
               "unsafe_permit_all_axioms": true,
               "num_threads": 4
             }
            __END__
            ROOT=$(cd ../../../.. && pwd)
            "$ROOT/lka.py" build-test init-prelude
            RUSTFLAGS="-C target-cpu=native -Cprofile-generate=$PWD/pgo" cargo build --release
            target/release/sokonanoda config.json < "$ROOT/_build/tests/init-prelude.ndjson" >/dev/null
            llvm-profdata merge -o "$PWD/pgo/merged.profdata" "$PWD/pgo"
            RUSTFLAGS="-C target-cpu=native -Cprofile-use=$PWD/pgo/merged.profdata" cargo build --release
          run: |
            target/release/sokonanoda config.json < "$IN" || exit 1
          EOF

      - name: Build both checkers with official MathGraph PGO recipe
        shell: 'nix develop -c bash -euxo pipefail {0}'
        working-directory: /tmp/arena
        run: |
          ./lka.py build-checker mathgraph-public
          ./lka.py build-checker mathgraph-jump32

      - name: Generate deciding official tests
        shell: 'nix develop -c bash -euxo pipefail {0}'
        working-directory: /tmp/arena
        run: |
          ./lka.py build-test mathlib
          ./lka.py build-test perf/beta-ladder
          ./lka.py build-test perf/grind-ring-5
          ./lka.py build-test perf/app-lam
          ./lka.py build-test std

      - name: Locate checker binaries
        shell: bash
        working-directory: /tmp/arena
        run: |
          set -euxo pipefail
          PUB=$(find _build/checkers/mathgraph-public -type f -path '*/target/release/sokonanoda' -perm -111 | head -1)
          J32=$(find _build/checkers/mathgraph-jump32 -type f -path '*/target/release/sokonanoda' -perm -111 | head -1)
          test -n "$PUB" && test -n "$J32"
          echo "PUB=$PWD/$PUB" >> "$GITHUB_ENV"
          echo "J32=$PWD/$J32" >> "$GITHUB_ENV"
          echo "PUB_CFG=$(dirname "$PUB")/../../config.json" >> "$GITHUB_ENV"
          echo "J32_CFG=$(dirname "$J32")/../../config.json" >> "$GITHUB_ENV"

      - name: Smoke-test Callgrind and semantic equality
        shell: bash
        working-directory: /tmp/arena
        run: |
          set -euxo pipefail
          "$PUB" "$PUB_CFG" < _build/tests/perf/beta-ladder.ndjson >/tmp/pub.out
          "$J32" "$J32_CFG" < _build/tests/perf/beta-ladder.ndjson >/tmp/j32.out
          diff -u /tmp/pub.out /tmp/j32.out
          valgrind --tool=callgrind --callgrind-out-file=/tmp/smoke.callgrind "$PUB" "$PUB_CFG" < _build/tests/perf/beta-ladder.ndjson >/dev/null
          grep '^summary:' /tmp/smoke.callgrind

      - name: Count retired guest instructions on deciding workloads
        shell: bash
        working-directory: /tmp/arena
        run: |
          set -euxo pipefail
          mkdir -p /tmp/callgrind
          for test in perf/beta-ladder perf/grind-ring-5 perf/app-lam std mathlib; do
            safe=${test//\//_}
            infile="_build/tests/$test.ndjson"
            echo "=== $test public ==="
            /usr/bin/time -f '%e %U %S %M' -o "/tmp/callgrind/${safe}.public.time" \
              valgrind --tool=callgrind --callgrind-out-file="/tmp/callgrind/${safe}.public" \
              "$PUB" "$PUB_CFG" < "$infile" >/dev/null
            echo "=== $test jump32 ==="
            /usr/bin/time -f '%e %U %S %M' -o "/tmp/callgrind/${safe}.jump32.time" \
              valgrind --tool=callgrind --callgrind-out-file="/tmp/callgrind/${safe}.jump32" \
              "$J32" "$J32_CFG" < "$infile" >/dev/null
          done

      - name: Decide private proxy gate
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY' | tee /tmp/private-proxy-summary.txt
          from pathlib import Path

          root=Path('/tmp/callgrind')
          tests=['perf_beta-ladder','perf_grind-ring-5','perf_app-lam','std','mathlib']

          def ir(path):
              events=None
              summary=None
              for line in Path(path).read_text(errors='replace').splitlines():
                  if line.startswith('events:'):
                      events=line.split(':',1)[1].split()
                  elif line.startswith('summary:'):
                      summary=[int(x) for x in line.split(':',1)[1].split()]
              assert events and summary, path
              assert 'Ir' in events, (path,events)
              return summary[events.index('Ir')]

          print('CALLGRIND Ir comparison (deterministic software instruction proxy; not official PMU counts)')
          ratios={}
          for t in tests:
              p=ir(root/f'{t}.public')
              j=ir(root/f'{t}.jump32')
              r=j/p
              ratios[t]=r
              print(f'{t}: public={p} jump32={j} ratio={r:.9f} delta={(r-1)*100:.4f}%')

          mr=ratios['mathlib']
          print(f'\nMATHLIB_CALLGRIND_IR_RATIO={mr:.9f} delta={(mr-1)*100:.4f}%')
          if mr < 0.995:
              print('PROXY_DECISION=PROMOTION_CANDIDATE')
          elif mr <= 1.005:
              print('PROXY_DECISION=MATHLIB_NEUTRAL')
          else:
              print('PROXY_DECISION=DO_NOT_PROMOTE')
          print('\nNOTE: official Arena PMU instruction counts remain the final leaderboard authority.')
          PY

      - name: Upload private proxy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathgraph-v2-private-callgrind-proxy
          path: |
            /tmp/private-proxy-summary.txt
            /tmp/callgrind/
            /tmp/smoke.callgrind
