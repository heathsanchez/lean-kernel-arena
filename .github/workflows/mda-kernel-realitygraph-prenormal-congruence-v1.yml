name: MDA Kernel RealityGraph pre-normal congruence
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/kernel-realitygraph-prenormal-congruence-v1.mjs'
      - '.github/workflows/mda-kernel-realitygraph-prenormal-congruence-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 20s node genesis/test.mjs
      - name: Test pre-normal structural congruence
        run: timeout 840s node experiments/kernel-realitygraph-prenormal-congruence-v1.mjs
