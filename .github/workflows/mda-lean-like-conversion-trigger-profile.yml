name: MDA Lean-like conversion trigger profile
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'genesis/lean-like-conversion-trigger-profile.mjs'
      - '.github/workflows/mda-lean-like-conversion-trigger-profile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconstruct retained present
        run: timeout 30s node --stack-size=32768 genesis/test.mjs
      - name: Build complete CI Arena set
        shell: 'nix develop -c bash -euxo pipefail {0}'
        run: ./lka.py build-test --skip-ci
      - name: Profile general conversion triggers
        run: timeout 300s node --stack-size=32768 genesis/lean-like-conversion-trigger-profile.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-like-conversion-trigger-profile-${{ github.sha }}
          path: genesis/evidence/lean-like-conversion-trigger-profile.json
          if-no-files-found: error
