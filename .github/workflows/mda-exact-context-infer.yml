name: MDA exact context infer separator
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'genesis/exact-context-infer-separator.mjs'
      - '.github/workflows/mda-exact-context-infer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  separate:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 15s node genesis/test.mjs
      - name: Test exact-context inference reuse
        run: timeout 180s node genesis/exact-context-infer-separator.mjs
      - name: Preserve separator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mda-exact-context-infer-${{ github.sha }}
          path: genesis/evidence/exact-context-infer-separator.json
          if-no-files-found: warn
