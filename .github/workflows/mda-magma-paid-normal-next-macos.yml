name: MDA magma continuation macOS
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - '.github/workflows/mda-magma-paid-normal-next-macos.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: node genesis/test.mjs
      - name: Follow magma frontier at higher budgets
        run: node experiments/magma-paid-normal-next.mjs
