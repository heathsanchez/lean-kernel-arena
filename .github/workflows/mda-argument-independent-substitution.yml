name: MDA argument independent substitution
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/argument-independent-substitution.mjs'
      - '.github/workflows/mda-argument-independent-substitution.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  separator:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: node genesis/test.mjs
      - name: Test exact argument-independent substitution
        run: node experiments/argument-independent-substitution.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: argument-independent-substitution-${{ github.sha }}
          path: genesis/evidence/argument-independent-substitution.json
          if-no-files-found: ignore
          retention-days: 7
