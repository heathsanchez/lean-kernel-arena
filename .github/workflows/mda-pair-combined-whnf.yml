name: MDA pair combined structural WHNF
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/pair-combined-whnf.mjs'
      - '.github/workflows/mda-pair-combined-whnf.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 20s node genesis/test.mjs
      - name: Compose structural WHNF with pair execution repair
        run: timeout 660s node experiments/pair-combined-whnf.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pair-combined-whnf-${{ github.sha }}
          path: genesis/evidence/pair-combined-whnf.json
          if-no-files-found: warn
