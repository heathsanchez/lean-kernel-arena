name: MDA beta environment closure separator
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'genesis/beta-environment-closure-layer.mjs'
      - 'genesis/beta-environment-closure-separator.mjs'
      - '.github/workflows/mda-beta-environment-closure-separator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Build focused witnesses
        shell: 'nix develop -c bash -euxo pipefail {0}'
        run: |
          ./lka.py build-test perf/shared-subterm
          ./lka.py build-test perf/church-numerals
          ./lka.py build-test perf/args-before-unfold
          ./lka.py build-test perf/folded-constant-first
          ./lka.py build-test perf/repeated-subproblem
          ./lka.py build-test perf/discarded-argument-match
          ./lka.py build-test undecidability/alg-conv-trans-acc-left
          ./lka.py build-test undecidability/alg-conv-trans-acc-right
          ./lka.py build-test undecidability/subject-reduction-redex
          ./lka.py build-test undecidability/alg-conv-trans-acc
          ./lka.py build-test undecidability/subject-reduction-reduct
      - name: Compare retained WHNF with beta environment closure
        run: timeout 240s node --stack-size=32768 genesis/beta-environment-closure-separator.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-environment-closure-evidence
          path: genesis/evidence/beta-environment-closure-separator.json
          if-no-files-found: error
