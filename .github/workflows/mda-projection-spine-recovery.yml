name: MDA projection spine recovery
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/projection-spine-recovery.mjs'
      - '.github/workflows/mda-projection-spine-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  separate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 15s node genesis/test.mjs
      - name: Test projection-local raw spine recovery
        run: timeout 240s node experiments/projection-spine-recovery.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projection-spine-recovery-${{ github.sha }}
          path: genesis/evidence/projection-spine-recovery.json
          if-no-files-found: warn
