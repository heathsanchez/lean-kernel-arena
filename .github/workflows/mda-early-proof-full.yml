name: MDA early proof irrelevance full
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/early-proof-irrelevance-full.mjs'
      - '.github/workflows/mda-early-proof-full.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: timeout 30s node genesis/test.mjs
      - run: timeout 150s node experiments/early-proof-irrelevance-full.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mda-early-proof-${{ github.sha }}
          path: genesis/evidence/early-proof-full.json
          if-no-files-found: warn
