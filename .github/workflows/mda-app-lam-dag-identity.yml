name: MDA app-lam DAG identity
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/app-lam-dag-identity.mjs'
      - '.github/workflows/mda-app-lam-dag-identity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Measure exported DAG identity
        run: timeout 90s node experiments/app-lam-dag-identity.mjs
