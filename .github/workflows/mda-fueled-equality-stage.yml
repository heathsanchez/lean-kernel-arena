name: MDA fueled equality stage
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/fueled-equality-stage.mjs'
      - '.github/workflows/mda-fueled-equality-stage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        budget: [1000000, 3000000]
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 20s node genesis/test.mjs
      - name: Meter one fueled equality
        env:
          BUDGET: ${{ matrix.budget }}
        run: timeout 300s node experiments/fueled-equality-stage.mjs
