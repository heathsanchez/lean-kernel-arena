name: MDA magma binder proof probe
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/magma-binder-proof.mjs'
      - '.github/workflows/mda-magma-binder-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 15s node genesis/test.mjs
      - name: Probe exact differing binders
        run: timeout 120s node experiments/magma-binder-proof.mjs
