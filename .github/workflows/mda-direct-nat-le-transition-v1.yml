name: Direct Nat le transition V1

on:
  push:
    branches: [mda-direct-nat-le-transition-v1]
    paths:
      - 'genesis/compiled-semantic-consequence-layer.mjs'
      - 'genesis/direct-nat-le-transition-v1.mjs'
      - '.github/workflows/mda-direct-nat-le-transition-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Protect cold core regressions
        run: |
          unset LEAN_DIRECT_NAT_LE_TRANSITION_V1
          node genesis/test.mjs
          node --test genesis/*.test.mjs

      - name: Retrieve current public Arena corpus
        run: |
          mkdir -p _build/tests
          curl --fail --location --retry 3 https://arena.lean-lang.org/lean-arena-tests.tar.gz -o /tmp/arena.tar.gz
          python3 - <<'PY'
          import tarfile,pathlib,json,hashlib
          root=pathlib.Path('_build/tests')
          rows=[]
          with tarfile.open('/tmp/arena.tar.gz','r:gz') as archive:
              for m in archive:
                  if not m.isfile() or not m.name.endswith('.ndjson'): continue
                  parts=pathlib.PurePosixPath(m.name).parts
                  group=next((i for i,x in enumerate(parts) if x in ('good','bad')),None)
                  if group is None: continue
                  name=pathlib.PurePosixPath(*parts[group+1:])
                  if name.is_absolute() or '..' in name.parts: raise ValueError(m.name)
                  data=archive.extractfile(m).read()
                  path=root/name
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(data)
                  rows.append(dict(
                      name=str(name),
                      expected='ACCEPT' if parts[group]=='good' else 'REJECT',
                      bytes=len(data),
                      sha256=hashlib.sha256(data).hexdigest(),
                  ))
          (root/'manifest.json').write_text(json.dumps(rows,indent=2))
          print('ARENA_CASES='+str(len(rows)))
          PY

      - name: Run paired deep-list target qualification
        run: |
          node --stack-size=32768 genesis/direct-nat-le-transition-v1.mjs             | tee /tmp/direct-nat-le-transition-v1.log
          grep -q PASS_DIRECT_NAT_LE_TRANSITION_V1             /tmp/direct-nat-le-transition-v1.log

      - name: Run cold public-corpus diagnostic
        run: |
          unset LEAN_DIRECT_NAT_LE_TRANSITION_V1
          node genesis/qualify-corpus.mjs             --diagnostic             --manifest _build/tests/manifest.json             --output /tmp/cold-corpus.json             --timeout 60000

      - name: Run candidate public-corpus diagnostic
        env:
          LEAN_DIRECT_NAT_LE_TRANSITION_V1: "1"
        run: |
          node genesis/qualify-corpus.mjs             --diagnostic             --manifest _build/tests/manifest.json             --output /tmp/candidate-corpus.json             --timeout 60000

      - name: Gate direct transition candidate
        run: |
          python3 - <<'PY'
          import json
          target=json.load(open('genesis/evidence/direct-nat-le-transition-v1.json'))
          cold=json.load(open('/tmp/cold-corpus.json'))
          cand=json.load(open('/tmp/candidate-corpus.json'))
          assert target['schema']=='direct-nat-le-transition-v1'
          assert all(target['gates'].values()),target['gates']
          assert target['precommit']['realitygraph_commit']=='c8837b46f507dfc556c37ada5c5af3550784ac25'
          assert cand['totals']['wrong']==0,cand['totals']
          assert cand['totals']['errors']==0,cand['totals']
          assert cand['totals']['correct']>=cold['totals']['correct']
          assert cand['totals']['wrong']<=cold['totals']['wrong']
          report={
              'schema':'direct-nat-le-transition-v1-qualified',
              'target':target,
              'cold_corpus_totals':cold['totals'],
              'candidate_corpus_totals':cand['totals'],
              'candidate_public_corpus_zero_wrong':cand['totals']['wrong']==0,
              'candidate_public_corpus_zero_errors':cand['totals']['errors']==0,
              'verdict':'PASS',
              'claim_boundary':'Exact guarded LE.le.{0} Nat instLENat -> Nat.le WHNF candidate, qualified on the paired deep-list targets and current public Arena corpus. UNKNOWN remains UNKNOWN; this does not authorize other LE instances or arbitrary typeclass projection.',
          }
          json.dump(report,open('/tmp/direct-nat-le-qualified.json','w'),indent=2,sort_keys=True)
          print(json.dumps(report,indent=2,sort_keys=True))
          print('PASS_DIRECT_NAT_LE_TRANSITION_PUBLIC_CORPUS_V1')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-nat-le-transition-v1
          path: |
            genesis/evidence/direct-nat-le-transition-v1.json
            /tmp/direct-nat-le-transition-v1.log
            /tmp/cold-corpus.json
            /tmp/candidate-corpus.json
            /tmp/direct-nat-le-qualified.json
          if-no-files-found: error
