name: MDA shared subterm current completion profile
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'genesis/shared-subterm-current-completion-profile.mjs'
      - '.github/workflows/mda-shared-subterm-current-completion-profile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Build shared-subterm
        shell: 'nix develop -c bash -euxo pipefail {0}'
        run: ./lka.py build-test perf/shared-subterm
      - name: Measure completion cliff and primitive cost
        run: timeout 420s node --stack-size=32768 genesis/shared-subterm-current-completion-profile.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-subterm-current-completion-profile
          path: genesis/evidence/shared-subterm-current-completion-profile.json
          if-no-files-found: error
