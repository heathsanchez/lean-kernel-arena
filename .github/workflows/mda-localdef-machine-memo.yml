name: MDA LocalDef machine memo
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/localdef-machine-memo.mjs'
      - '.github/workflows/mda-localdef-machine-memo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  separate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 15s node genesis/test.mjs
      - name: Test exact continuation-state inference memo
        run: timeout 240s node experiments/localdef-machine-memo.mjs
      - name: Preserve memo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mda-localdef-machine-memo-${{ github.sha }}
          path: genesis/evidence/localdef-machine-memo.json
          if-no-files-found: warn
