name: MDA raw proof spine
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/raw-proof-spine.mjs'
      - '.github/workflows/mda-raw-proof-spine.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  separator:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 15s node genesis/test.mjs
      - name: Run raw proof spine full-corpus separator
        run: timeout 180s node experiments/raw-proof-spine.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-proof-spine-evidence
          path: genesis/evidence/raw-proof-spine.json
          if-no-files-found: ignore
