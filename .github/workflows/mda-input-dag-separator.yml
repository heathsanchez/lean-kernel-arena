name: MDA input DAG separator
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'genesis/input-dag-separator.mjs'
      - '.github/workflows/mda-input-dag-separator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  separate:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct frozen retained present
        run: timeout 15s node genesis/test.mjs
      - name: Test exact input DAG canonicalization
        run: timeout 180s node --stack-size=32768 genesis/input-dag-separator.mjs
      - name: Preserve separator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mda-input-dag-separator-${{ github.sha }}
          path: genesis/evidence/input-dag-separator.json
          if-no-files-found: warn
