name: MDA capped creative conversion stress
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'genesis/capped-def-var-creative-stress.mjs'
      - '.github/workflows/mda-capped-creative-stress.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconstruct retained present
        run: timeout 30s node --stack-size=32768 genesis/test.mjs
      - name: Build stress witnesses
        shell: 'nix develop -c bash -euxo pipefail {0}'
        run: |
          ./lka.py build-test perf/church-numerals
          ./lka.py build-test perf/discarded-argument-match
          ./lka.py build-test perf/discarded-argument
          ./lka.py build-test undecidability/alg-conv-trans-acc-left
          ./lka.py build-test undecidability/alg-conv-trans-acc-right
          ./lka.py build-test undecidability/subject-reduction-redex
          ./lka.py build-test undecidability/alg-conv-trans-acc
          ./lka.py build-test undecidability/subject-reduction-reduct
      - name: Stress capped conversion
        run: timeout 180s node --stack-size=32768 genesis/capped-def-var-creative-stress.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capped-creative-stress-${{ github.sha }}
          path: genesis/evidence/capped-def-var-creative-stress.json
          if-no-files-found: error
