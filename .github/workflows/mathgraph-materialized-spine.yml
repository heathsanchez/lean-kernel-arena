name: MathGraph materialized-spine Arena gate

on:
  workflow_dispatch:
  push:
    branches: [mathgraph-materialized-spine]
    paths:
      - 'MATERIALIZED_SPINE_ARENA_TRIGGER'

jobs:
  fullsuite:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build major workloads
        shell: nix develop -c bash -euxo pipefail {0}
        run: |
          for t in cedar cslib mathlib init-prelude; do
            ./lka.py build-test "$t"
          done

      - name: Build pinned sokonanoda
        shell: nix develop -c bash -euxo pipefail {0}
        run: ./lka.py build-checker sokonanoda

      - name: Build materialized-key candidate
        shell: nix develop -c bash -euxo pipefail {0}
        run: ./lka.py build-checker mathgraph-materialized-spine

      - name: Same-runner major-suite comparison
        shell: nix develop -c bash -euxo pipefail {0}
        run: |
          for t in cedar cslib mathlib init-prelude; do
            echo "===== $t :: pinned ====="
            /usr/bin/time -v ./lka.py run --checker sokonanoda --test "$t"
            echo "===== $t :: materialized-key ====="
            /usr/bin/time -v ./lka.py run --checker mathgraph-materialized-spine --test "$t"
          done

      - name: Build semantic battery
        shell: nix develop -c bash -euxo pipefail {0}
        run: |
          for t in bogus1 constlevels ctor-num-fields init init-prelude; do
            ./lka.py build-test "$t"
          done

      - name: Candidate semantic battery
        shell: nix develop -c bash -euxo pipefail {0}
        run: |
          set -euo pipefail
          for t in bogus1 constlevels ctor-num-fields; do
            echo "===== expected reject: $t ====="
            if ./lka.py run --checker mathgraph-materialized-spine --test "$t"; then
              echo "unexpected accept: $t"
              exit 1
            fi
          done
          for t in init init-prelude; do
            echo "===== expected accept: $t ====="
            ./lka.py run --checker mathgraph-materialized-spine --test "$t"
          done
