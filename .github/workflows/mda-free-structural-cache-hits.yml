name: MDA compiled structural consequences
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/free-structural-cache-hits.mjs'
      - '.github/workflows/mda-free-structural-cache-hits.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 15s node genesis/test.mjs
      - name: Replay exact structural consequence reuse
        run: timeout 150s node experiments/free-structural-cache-hits.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mda-free-structural-cache-hits-${{ github.sha }}
          path: genesis/evidence/free-structural-cache-hits.json
          if-no-files-found: warn
