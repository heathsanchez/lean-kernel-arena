name: MDA lazy closure separator
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'genesis/lazy-closure-separator.mjs'
      - '.github/workflows/mda-lazy-closure-separator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  separate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct frozen retained present
        run: timeout 15s node genesis/test.mjs
      - name: Test transparent lazy substitution closures
        run: timeout 240s node --stack-size=32768 genesis/lazy-closure-separator.mjs
      - name: Preserve separator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mda-lazy-closure-separator-${{ github.sha }}
          path: genesis/evidence/lazy-closure-separator.json
          if-no-files-found: warn
