name: MDA exact consequence compiler
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/exact-consequence-compiler.mjs'
      - '.github/workflows/mda-exact-consequence-compiler.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 20s node genesis/test.mjs
      - name: Run exact consequence compiler separator
        run: timeout 420s node experiments/exact-consequence-compiler.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mda-exact-consequence-compiler-${{ github.sha }}
          path: genesis/evidence/exact-consequence-compiler.json
          if-no-files-found: error
          retention-days: 7
