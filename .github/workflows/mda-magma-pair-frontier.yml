name: MDA magma pair frontier
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/magma-pair-frontier.mjs'
      - '.github/workflows/mda-magma-pair-frontier.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect exact magma pair frontiers
        run: timeout 90s node experiments/magma-pair-frontier.mjs
