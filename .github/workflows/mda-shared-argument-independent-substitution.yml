name: MDA shared argument-independent substitution
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/shared-argument-independent-substitution.mjs'
      - '.github/workflows/mda-shared-argument-independent-substitution.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  separator:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 20s node genesis/test.mjs
      - name: Test shared-subterm substitution specialization
        run: timeout 300s node experiments/shared-argument-independent-substitution.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-arg-independent-${{ github.sha }}
          path: genesis/evidence/shared-argument-independent-substitution.json
          if-no-files-found: ignore
          retention-days: 7
