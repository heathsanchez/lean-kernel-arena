name: MDA minimal semantic kernel inductive ablation
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/minimal-semantic-kernel-inductive-ablation-v1.mjs'
      - '.github/workflows/mda-minimal-semantic-kernel-inductive-ablation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 20s node genesis/test.mjs
      - name: Run inductive primitive ablation lattice
        run: timeout 840s node experiments/minimal-semantic-kernel-inductive-ablation-v1.mjs
