name: isValidChar method profile V1

on:
  push:
    branches: [mda-isvalidchar-method-profile-v1]
    paths:
      - 'genesis/isvalidchar-method-profile-v1.mjs'
      - '.github/workflows/mda-isvalidchar-method-profile-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Protect core regressions
        run: |
          node genesis/test.mjs
          node --test genesis/*.test.mjs

      - name: Retrieve current public Arena corpus
        run: |
          mkdir -p _build/tests
          curl --fail --location --retry 3 https://arena.lean-lang.org/lean-arena-tests.tar.gz -o /tmp/arena.tar.gz
          python3 - <<'PY'
          import tarfile,pathlib
          root=pathlib.Path('_build/tests')
          with tarfile.open('/tmp/arena.tar.gz','r:gz') as archive:
              for m in archive:
                  if not m.isfile() or not m.name.endswith('.ndjson'): continue
                  parts=pathlib.PurePosixPath(m.name).parts
                  group=next((i for i,x in enumerate(parts) if x in ('good','bad')),None)
                  if group is None: continue
                  name=pathlib.PurePosixPath(*parts[group+1:])
                  if name.is_absolute() or '..' in name.parts: raise ValueError(m.name)
                  data=archive.extractfile(m).read()
                  path=root/name
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(data)
          PY

      - name: Profile isValidChar method concentration
        run: |
          node --stack-size=32768 genesis/isvalidchar-method-profile-v1.mjs             | tee /tmp/isvalidchar-method-profile-v1.log
          grep -q PASS_ISVALIDCHAR_METHOD_PROFILE_V1             /tmp/isvalidchar-method-profile-v1.log

      - name: Gate profile
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('genesis/evidence/isvalidchar-method-profile-v1.json'))
          assert r['schema']=='isvalidchar-method-profile-v1'
          assert all(r['gates'].values()),r['gates']
          assert r['precommit']['realitygraph_commit']=='6bb224e72e2183e79b40298a5033349159a7e59e'
          assert len(r['rows'])==2
          for row in r['rows']:
              m=row['attempts'][-1]['top_method_ticks_for_profiled_declaration']
              print(row['name'],m[:8])
          print('PASS_ISVALIDCHAR_METHOD_PROFILE_V1')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isvalidchar-method-profile-v1
          path: |
            genesis/evidence/isvalidchar-method-profile-v1.json
            /tmp/isvalidchar-method-profile-v1.log
          if-no-files-found: error
