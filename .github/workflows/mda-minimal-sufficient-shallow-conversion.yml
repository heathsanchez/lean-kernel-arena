name: MDA minimal sufficient shallow conversion
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'genesis/minimal-sufficient-shallow-conversion.mjs'
      - '.github/workflows/mda-minimal-sufficient-shallow-conversion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconstruct retained present
        run: timeout 30s node --stack-size=32768 genesis/test.mjs
      - name: Build complete CI Arena set
        shell: 'nix develop -c bash -euxo pipefail {0}'
        run: ./lka.py build-test --skip-ci
      - name: Test minimal sufficient shallow conversion
        run: timeout 300s node --stack-size=32768 genesis/minimal-sufficient-shallow-conversion.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimal-sufficient-shallow-conversion-${{ github.sha }}
          path: genesis/evidence/minimal-sufficient-shallow-conversion.json
          if-no-files-found: error
