name: MDA early Pi congruence
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/early-pi-congruence.mjs'
      - '.github/workflows/mda-early-pi-congruence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  separator:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 20s node genesis/test.mjs
      - name: Run early Pi congruence separator
        run: timeout 420s node experiments/early-pi-congruence.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: early-pi-congruence-${{ github.sha }}
          path: genesis/evidence/early-pi-congruence.json
          if-no-files-found: error
          retention-days: 7
