name: MDA irrelevance-first focus
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/irrelevance-first-focus.mjs'
      - '.github/workflows/mda-irrelevance-first-focus.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focus:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 15s node genesis/test.mjs
      - name: Probe proof irrelevance before normalization
        run: timeout 120s node --stack-size=32768 experiments/irrelevance-first-focus.mjs
