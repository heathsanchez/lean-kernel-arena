name: MDA iterative WHNF separator
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/iterative-whnf.mjs'
      - '.github/workflows/mda-iterative-whnf.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  separate:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 15s node genesis/test.mjs
      - name: Test iterative ordinary WHNF
        run: timeout 150s node experiments/iterative-whnf.mjs
      - name: Preserve separator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mda-iterative-whnf-${{ github.sha }}
          path: genesis/evidence/iterative-whnf-separator.json
          if-no-files-found: warn
