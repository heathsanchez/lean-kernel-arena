name: MDA fueled Eq argument trace
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/fueled-eq-arg-trace.mjs'
      - '.github/workflows/mda-fueled-eq-arg-trace.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 20s node genesis/test.mjs
      - name: Trace failed fueled Eq arguments
        run: timeout 240s node experiments/fueled-eq-arg-trace.mjs
