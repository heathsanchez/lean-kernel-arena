name: MDA Lean-like conversion sharded diagnostic

on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'genesis/lean-like-conversion-order-shard.mjs'
      - '.github/workflows/mda-lean-like-conversion-order-sharded.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconstruct retained present
        run: timeout 30s node --stack-size=32768 genesis/test.mjs
      - name: Build complete CI Arena set
        shell: 'nix develop -c bash -euxo pipefail {0}'
        run: ./lka.py build-test --skip-ci
      - name: Shard candidate replay with row progress
        run: |
          set +e
          rm -f shard-*.log shard-*.rc
          for i in 0 1 2 3; do
            (
              SHARD_COUNT=4 SHARD_INDEX=$i timeout 300s node --stack-size=32768                 genesis/lean-like-conversion-order-shard.mjs > "shard-$i.log" 2>&1
              echo $? > "shard-$i.rc"
            ) &
          done
          wait
          rc=0
          for i in 0 1 2 3; do
            echo "===== SHARD $i ====="
            cat "shard-$i.log" || true
            code=$(cat "shard-$i.rc" 2>/dev/null || echo 999)
            echo "SHARD_EXIT $i $code"
            if [ "$code" -ne 0 ]; then rc=1; fi
          done
          exit "$rc"
      - name: Preserve shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-like-conversion-shards-${{ github.sha }}
          path: |
            genesis/evidence/lean-like-conversion-order-shard-*.json
            shard-*.log
            shard-*.rc
          if-no-files-found: warn
