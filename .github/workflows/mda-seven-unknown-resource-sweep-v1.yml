name: Lean seven UNKNOWN resource sweep V1
on:
  push:
    branches: [mda-seven-unknown-resource-sweep-v1]
    paths:
      - 'genesis/seven-unknown-resource-sweep-v1.mjs'
      - '.github/workflows/mda-seven-unknown-resource-sweep-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Protect core regressions
        run: |
          node genesis/test.mjs
          node --test genesis/*.test.mjs
      - name: Retrieve current public Arena corpus
        run: |
          mkdir -p _build/tests
          curl --fail --location --retry 3 https://arena.lean-lang.org/lean-arena-tests.tar.gz -o /tmp/arena.tar.gz
          python3 - <<'PY'
          import tarfile,pathlib,json,hashlib
          root=pathlib.Path('_build/tests')
          rows=[]
          with tarfile.open('/tmp/arena.tar.gz','r:gz') as archive:
              for m in archive:
                  if not m.isfile() or not m.name.endswith('.ndjson'): continue
                  parts=pathlib.PurePosixPath(m.name).parts
                  group=next((i for i,x in enumerate(parts) if x in ('good','bad')),None)
                  if group is None: continue
                  name=pathlib.PurePosixPath(*parts[group+1:])
                  if name.is_absolute() or '..' in name.parts: raise ValueError(m.name)
                  data=archive.extractfile(m).read()
                  path=root/name
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(data)
                  rows.append(dict(name=str(name),expected='ACCEPT' if parts[group]=='good' else 'REJECT',bytes=len(data),sha256=hashlib.sha256(data).hexdigest()))
          (root/'manifest.json').write_text(json.dumps(rows,indent=2))
          print('ARENA_CASES='+str(len(rows)))
          PY
      - name: Sweep exact seven residuals
        run: |
          timeout 1000s node genesis/seven-unknown-resource-sweep-v1.mjs             | tee /tmp/seven-unknown-resource-sweep-v1.log
          grep -q PASS_LEAN_SEVEN_UNKNOWN_RESOURCE_SWEEP_V1 /tmp/seven-unknown-resource-sweep-v1.log
          python3 - <<'PY'
          import json
          r=json.load(open('genesis/evidence/seven-unknown-resource-sweep-v1.json'))
          assert all(r['gates'].values())
          print('CLOSED='+str(r['closed_count']))
          print('OPEN='+str(r['still_open_count']))
          print(json.dumps(r['minimal_accept_envelope'],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-seven-unknown-resource-sweep-v1
          path: |
            genesis/evidence/seven-unknown-resource-sweep-v1.json
            /tmp/seven-unknown-resource-sweep-v1.log
          if-no-files-found: error
