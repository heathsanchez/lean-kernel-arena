name: MDA declaration bidirectional check
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/declaration-bidirectional-check.mjs'
      - '.github/workflows/mda-declaration-bidirectional-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  separate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 20s node genesis/test.mjs
      - name: Test declaration-boundary bidirectional checking
        run: timeout 660s node experiments/declaration-bidirectional-check.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: declaration-bidirectional-check-${{ github.sha }}
          path: genesis/evidence/declaration-bidirectional-check.json
          if-no-files-found: warn
