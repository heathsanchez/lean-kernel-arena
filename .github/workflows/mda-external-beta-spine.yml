name: MDA external beta spine
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/external-beta-spine.mjs'
      - '.github/workflows/mda-external-beta-spine.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  separate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 20s node genesis/test.mjs
      - name: Test simultaneous external beta spine
        run: timeout 660s node experiments/external-beta-spine.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-beta-spine-${{ github.sha }}
          path: genesis/evidence/external-beta-spine.json
          if-no-files-found: warn
