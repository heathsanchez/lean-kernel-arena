name: MDA constructor field race
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/constructor-field-race.mjs'
      - '.github/workflows/mda-constructor-field-race.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  race:
    strategy:
      fail-fast: false
      matrix:
        quantum: [500, 2000, 5000]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 20s node genesis/test.mjs
      - name: Race constructor fields fairly
        env:
          QUANTUM: ${{ matrix.quantum }}
        run: timeout 420s node experiments/constructor-field-race.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctor-field-race-${{ matrix.quantum }}-${{ github.sha }}
          path: genesis/evidence/constructor-field-race.json
          if-no-files-found: ignore
          retention-days: 7
