name: MDA multi beta materialization
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/multi-beta-materialization.mjs'
      - '.github/workflows/mda-multi-beta-materialization.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  separator:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: node genesis/test.mjs
      - name: Test exact multi-beta materialization
        run: node experiments/multi-beta-materialization.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-beta-materialization-${{ github.sha }}
          path: genesis/evidence/multi-beta-materialization.json
          if-no-files-found: ignore
          retention-days: 7
