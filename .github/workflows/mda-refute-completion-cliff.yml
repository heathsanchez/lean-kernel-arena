name: MDA refutation completion cliff
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/refute-completion-cliff.mjs'
      - '.github/workflows/mda-refute-completion-cliff.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: node genesis/test.mjs
      - name: Measure eventual refutation certificate
        run: node --stack_size=65500 experiments/refute-completion-cliff.mjs
