name: MathGraph warm projection Mathlib continuation

on:
  push:
    branches: [mathgraph-warm-mathlib-callgrind]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mathlib:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install deterministic instruction counter
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          valgrind --version

      - name: Clone exact pinned Arena
        run: |
          set -euxo pipefail
          git clone https://github.com/leanprover/lean-kernel-arena /tmp/arena
          git -C /tmp/arena checkout ac1c13762de41b594fa24b90ede8cfd97ac6a765
          test "$(git -C /tmp/arena rev-parse HEAD)" = "ac1c13762de41b594fa24b90ede8cfd97ac6a765"

      - name: Define frozen candidate only
        working-directory: /tmp/arena
        run: |
          cat > checkers/mathgraph-warm.yaml <<'EOF'
          description: "Warm-projection candidate c6d445; continuation of run 34824466212."
          url: https://github.com/metalogiclabs/mathgraph-lean-kernel
          ref: candidate/warm-projection-v1
          rev: c6d445a954def8922490d0cd874ea134b45463dd
          build: |
            cat > config.json <<__END__
             {
               "use_stdin": true,
               "nat_extension": true,
               "string_extension": true,
               "unpermitted_axiom_hard_error": false,
               "unsafe_permit_all_axioms": true,
               "num_threads": 4
             }
            __END__
            ROOT=$(cd ../../../.. && pwd)
            "$ROOT/lka.py" build-test init-prelude
            RUSTFLAGS="-C target-cpu=native -Cprofile-generate=$PWD/pgo" cargo build --release
            target/release/sokonanoda config.json < "$ROOT/_build/tests/init-prelude.ndjson" >/dev/null
            llvm-profdata merge -o "$PWD/pgo/merged.profdata" "$PWD/pgo"
            RUSTFLAGS="-C target-cpu=native -Cprofile-use=$PWD/pgo/merged.profdata" cargo build --release
          run: |
            target/release/sokonanoda config.json < "$IN" || exit 1
          EOF

      - name: Build candidate with frozen official PGO recipe
        working-directory: /tmp/arena
        run: ./lka.py build-checker mathgraph-warm
        shell: 'nix develop -c bash -euxo pipefail {0}'

      - name: Build only Mathlib input
        working-directory: /tmp/arena
        run: ./lka.py build-test mathlib
        shell: 'nix develop -c bash -euxo pipefail {0}'

      - name: Locate candidate
        working-directory: /tmp/arena
        run: |
          set -euxo pipefail
          WARM=$(find _build/checkers/mathgraph-warm -type f -path '*/target/release/sokonanoda' -perm -111 | head -1)
          test -n "$WARM"
          echo "WARM=$PWD/$WARM" >> "$GITHUB_ENV"
          echo "WARM_CFG=$(dirname "$WARM")/../../config.json" >> "$GITHUB_ENV"

      - name: Verify candidate Mathlib semantics
        working-directory: /tmp/arena
        run: |
          set -euxo pipefail
          "$WARM" "$WARM_CFG" < _build/tests/mathlib.ndjson >/tmp/mathlib-warm.out
          test -s /tmp/mathlib-warm.out

      - name: Count missing candidate Mathlib instructions
        working-directory: /tmp/arena
        run: |
          set -euxo pipefail
          valgrind --tool=callgrind             --callgrind-out-file=/tmp/mathlib.warm             "$WARM" "$WARM_CFG" < _build/tests/mathlib.ndjson >/dev/null
          grep '^summary:' /tmp/mathlib.warm

      - name: Decide continuation gate
        run: |
          set -euxo pipefail
          python3 - <<'PY' | tee /tmp/mathlib-continuation-summary.txt
          import json
          from pathlib import Path

          BASE=879944592372
          ARTIFACT=10353498615
          ARTIFACT_SHA256='9423d4c95e3f1b229314e02ce61ea1aebf06667e6d5c61885e3f35711eaf347c'

          events=None
          summary=None
          for line in Path('/tmp/mathlib.warm').read_text(errors='replace').splitlines():
              if line.startswith('events:'):
                  events=line.split(':',1)[1].split()
              elif line.startswith('summary:'):
                  summary=[int(x) for x in line.split(':',1)[1].split()]
          assert events and summary and 'Ir' in events
          warm=summary[events.index('Ir')]
          ratio=warm/BASE
          reduction=100*(1-ratio)

          if ratio < 0.995:
              decision='PROXY_PROMOTION_CANDIDATE'
          elif ratio <= 1.005:
              decision='PROXY_MATHLIB_NEUTRAL'
          else:
              decision='PROXY_DO_NOT_PROMOTE'

          out={
            'experiment':'MATHGRAPH_WARM_PROJECTION_MATHLIB_CALLGRIND_CONTINUATION',
            'arena':'ac1c13762de41b594fa24b90ede8cfd97ac6a765',
            'base_rev':'d6a73279e6765e637f9741180cefbd7ef957d8e5',
            'candidate_rev':'c6d445a954def8922490d0cd874ea134b45463dd',
            'base_mathlib_ir':BASE,
            'base_evidence_run':34824466212,
            'base_evidence_artifact':ARTIFACT,
            'base_evidence_artifact_sha256':ARTIFACT_SHA256,
            'candidate_mathlib_ir':warm,
            'ratio':ratio,
            'reduction_pct':reduction,
            'decision':decision,
            'claim_boundary':'Deterministic Callgrind Ir proxy. Base is immutable completed evidence from run 34824466212; official Arena PMU retired instructions remain authoritative.'
          }
          Path('/tmp/mathlib-continuation-result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print('MDA_MATHLIB_CONTINUATION='+json.dumps(out,sort_keys=True))
          PY

      - name: Upload continuation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathgraph-warm-mathlib-callgrind-continuation
          path: |
            /tmp/mathlib.warm
            /tmp/mathlib-warm.out
            /tmp/mathlib-continuation-summary.txt
            /tmp/mathlib-continuation-result.json
          retention-days: 90
