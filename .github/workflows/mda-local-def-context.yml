name: MDA local-definition context separator
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'genesis/local-def-context.mjs'
      - '.github/workflows/mda-local-def-context.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  separate:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct frozen retained present
        run: timeout 15s node genesis/test.mjs
      - name: Test retained local-definition state
        run: timeout 180s node --stack-size=32768 genesis/local-def-context.mjs
      - name: Preserve separator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mda-local-def-context-${{ github.sha }}
          path: genesis/evidence/local-def-context.json
          if-no-files-found: warn
