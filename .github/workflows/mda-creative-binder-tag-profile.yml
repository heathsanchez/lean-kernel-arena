name: MDA creative binder tag profile
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'genesis/creative-binder-tag-profile.mjs'
      - '.github/workflows/mda-creative-binder-tag-profile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconstruct retained present
        run: timeout 30s node --stack-size=32768 genesis/test.mjs
      - name: Build creative witnesses
        shell: 'nix develop -c bash -euxo pipefail {0}'
        run: |
          ./lka.py build-test undecidability/alg-conv-trans-acc-left
          ./lka.py build-test undecidability/alg-conv-trans-acc-right
          ./lka.py build-test undecidability/subject-reduction-redex
          ./lka.py build-test undecidability/alg-conv-trans-acc
          ./lka.py build-test undecidability/subject-reduction-reduct
      - name: Profile Pi vs lambda first refusal
        run: timeout 120s node --stack-size=32768 genesis/creative-binder-tag-profile.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creative-binder-tag-profile-${{ github.sha }}
          path: genesis/evidence/creative-binder-tag-profile.json
          if-no-files-found: error
