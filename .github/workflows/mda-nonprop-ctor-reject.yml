name: MDA non-Prop constructor reject
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/nonprop-ctor-reject.mjs'
      - '.github/workflows/mda-nonprop-ctor-reject.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  separate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 15s node genesis/test.mjs
      - name: Test non-Prop constructor negative consequence
        run: timeout 240s node experiments/nonprop-ctor-reject.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mda-nonprop-ctor-reject-${{ github.sha }}
          path: genesis/evidence/nonprop-ctor-reject.json
          if-no-files-found: warn
