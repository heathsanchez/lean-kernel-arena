name: MDA native Nat reject profile
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'genesis/native-nat-reject-profile.mjs'
      - '.github/workflows/mda-native-nat-reject-profile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Restore giant witnesses
        id: giant-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            _build/tests/init-prelude.ndjson
            _build/tests/perf/grind-ring-5.ndjson
          key: giant-frontier-${{ hashFiles('tests/init_prelude_module.lean', 'tests/perf/grind-ring-5.lean', 'tests/perf/shared-subterm.lean') }}
      - name: Build witnesses on cache miss
        if: steps.giant-cache.outputs.cache-hit != 'true'
        shell: 'nix develop -c bash -euxo pipefail {0}'
        run: |
          ./lka.py build-test init-prelude
          ./lka.py build-test perf/grind-ring-5
      - name: Profile reject
        env:
          MATHGRAPH_INPUT_BYTE_LIMIT: "15000000"
          MATHGRAPH_RECORD_LIMIT: "250000"
        run: node --stack-size=32768 genesis/native-nat-reject-profile.mjs
