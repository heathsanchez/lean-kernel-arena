name: isValidChar operation chain diagnostic V1

on:
  push:
    branches: [mda-isvalidchar-operation-chain-diagnostic-v1]
    paths:
      - 'genesis/isvalidchar-operation-chain-diagnostic-v1.mjs'
      - '.github/workflows/mda-isvalidchar-operation-chain-diagnostic-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Protect core regressions
        run: |
          node genesis/test.mjs
          node --test genesis/*.test.mjs

      - name: Retrieve current public Arena corpus
        run: |
          mkdir -p _build/tests
          curl --fail --location --retry 3 https://arena.lean-lang.org/lean-arena-tests.tar.gz -o /tmp/arena.tar.gz
          python3 - <<'PY'
          import tarfile,pathlib
          root=pathlib.Path('_build/tests')
          with tarfile.open('/tmp/arena.tar.gz','r:gz') as archive:
              for m in archive:
                  if not m.isfile() or not m.name.endswith('.ndjson'): continue
                  parts=pathlib.PurePosixPath(m.name).parts
                  group=next((i for i,x in enumerate(parts) if x in ('good','bad')),None)
                  if group is None: continue
                  name=pathlib.PurePosixPath(*parts[group+1:])
                  if name.is_absolute() or '..' in name.parts: raise ValueError(m.name)
                  data=archive.extractfile(m).read()
                  path=root/name
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(data)
          PY

      - name: Profile isValidChar operation chain
        run: |
          node --stack-size=32768 genesis/isvalidchar-operation-chain-diagnostic-v1.mjs             | tee /tmp/isvalidchar-operation-chain-diagnostic-v1.log
          grep -q PASS_ISVALIDCHAR_OPERATION_CHAIN_DIAGNOSTIC_V1             /tmp/isvalidchar-operation-chain-diagnostic-v1.log

      - name: Gate operation-chain evidence
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('genesis/evidence/isvalidchar-operation-chain-diagnostic-v1.json'))
          assert r['schema']=='isvalidchar-operation-chain-diagnostic-v1'
          assert all(r['gates'].values()),r['gates']
          assert r['precommit']['realitygraph_commit']=='e06d6b29fd4b0eefe5e890a40bbafc379ae9f105'
          assert r['classification'] in {'stable-edge-basis','distributed-chain'}
          print('PASS_ISVALIDCHAR_OPERATION_CHAIN_DIAGNOSTIC_V1')
          print('CLASSIFICATION='+r['classification'])
          for row in r['rows']:
              a=row['attempts'][-1]
              print(row['name'],{
                  'top5_coverage':a['top5_method_edge_coverage'],
                  'top_edges':a['top_method_edges'][:8],
              })
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isvalidchar-operation-chain-diagnostic-v1
          path: |
            genesis/evidence/isvalidchar-operation-chain-diagnostic-v1.json
            /tmp/isvalidchar-operation-chain-diagnostic-v1.log
          if-no-files-found: error
