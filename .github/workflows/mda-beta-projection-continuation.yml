name: MDA beta projection continuation
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/multi-beta-projection-continuation.mjs'
      - '.github/workflows/mda-beta-projection-continuation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  separator:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 20s node genesis/test.mjs
      - name: Test beta plus projection continuation
        run: timeout 420s node experiments/multi-beta-projection-continuation.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-projection-continuation-${{ github.sha }}
          path: genesis/evidence/multi-beta-projection-continuation.json
          if-no-files-found: ignore
          retention-days: 7
