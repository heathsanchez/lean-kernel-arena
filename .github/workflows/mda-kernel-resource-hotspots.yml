name: MDA kernel resource hotspot atlas
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'genesis/resource-hotspots.mjs'
      - '.github/workflows/mda-kernel-resource-hotspots.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct frozen retained present
        run: timeout 15s node genesis/test.mjs
      - name: Attribute frozen residual work without changing semantics
        run: timeout 120s node --stack-size=32768 genesis/resource-hotspots.mjs
      - name: Preserve hotspot atlas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mda-kernel-resource-hotspots-${{ github.sha }}
          path: genesis/evidence/resource-hotspots.json
          if-no-files-found: warn
