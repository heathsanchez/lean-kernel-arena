name: MDA deferred substitution v2 separator
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'genesis/deferred-substitution-v2.mjs'
      - '.github/workflows/mda-deferred-substitution-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  separate:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 15s node genesis/test.mjs
      - name: Test direct-redex persistent environments
        run: timeout 180s node --stack-size=32768 genesis/deferred-substitution-v2.mjs
      - name: Preserve separator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mda-deferred-substitution-v2-${{ github.sha }}
          path: genesis/evidence/deferred-substitution-v2.json
          if-no-files-found: warn
