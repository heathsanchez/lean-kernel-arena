name: Substitute node reuse accounting V1

on:
  push:
    branches: [mda-substitute-node-reuse-accounting-v1]
    paths:
      - 'genesis/substitute-node-reuse-accounting-v1.mjs'
      - '.github/workflows/mda-substitute-node-reuse-accounting-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Protect core regressions
        run: |
          node genesis/test.mjs
          node --test genesis/*.test.mjs

      - name: Retrieve current public Arena corpus
        run: |
          mkdir -p _build/tests
          curl --fail --location --retry 3 https://arena.lean-lang.org/lean-arena-tests.tar.gz -o /tmp/arena.tar.gz
          python3 - <<'PY'
          import tarfile,pathlib
          root=pathlib.Path('_build/tests')
          with tarfile.open('/tmp/arena.tar.gz','r:gz') as archive:
              for m in archive:
                  if not m.isfile() or not m.name.endswith('.ndjson'): continue
                  parts=pathlib.PurePosixPath(m.name).parts
                  group=next((i for i,x in enumerate(parts) if x in ('good','bad')),None)
                  if group is None: continue
                  name=pathlib.PurePosixPath(*parts[group+1:])
                  if name.is_absolute() or '..' in name.parts: raise ValueError(m.name)
                  data=archive.extractfile(m).read()
                  path=root/name
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(data)
          PY

      - name: Run substitute node-reuse accounting
        run: |
          node --stack-size=32768 genesis/substitute-node-reuse-accounting-v1.mjs             | tee /tmp/substitute-node-reuse-accounting-v1.log
          grep -q PASS_SUBSTITUTE_NODE_REUSE_ACCOUNTING_V1             /tmp/substitute-node-reuse-accounting-v1.log

      - name: Gate node-reuse evidence
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('genesis/evidence/substitute-node-reuse-accounting-v1.json'))
          assert r['schema']=='substitute-node-reuse-accounting-v1'
          assert all(r['gates'].values()),r['gates']
          assert r['precommit']['realitygraph_commit']=='328d597b2836846e67ff527acd1434311792cc11'
          assert r['classification'] in {'reuse-saturated','allocation-dominant','mixed'}
          print('PASS_SUBSTITUTE_NODE_REUSE_ACCOUNTING_V1')
          print('CLASSIFICATION='+r['classification'])
          for row in r['rows']:
              print(row['name'],{
                  'total':row['substitute_make_stats']['total'],
                  'reuse_fraction':row['substitute_make_reuse_fraction'],
                  'fresh_fraction':row['substitute_make_fresh_fraction'],
                  'by_tag':row['substitute_make_by_tag'][:8],
              })
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: substitute-node-reuse-accounting-v1
          path: |
            genesis/evidence/substitute-node-reuse-accounting-v1.json
            /tmp/substitute-node-reuse-accounting-v1.log
          if-no-files-found: error
