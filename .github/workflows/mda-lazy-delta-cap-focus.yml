name: MDA lazy delta cap focus
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/lazy-delta-cap-focus.mjs'
      - '.github/workflows/mda-lazy-delta-cap-focus.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focus:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 15s node genesis/test.mjs
      - name: Measure lazy delta cap threshold
        run: timeout 150s node experiments/lazy-delta-cap-focus.mjs
