name: MDA magma pair first diff
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/magma-pair-first-diff.mjs'
      - '.github/workflows/mda-magma-pair-first-diff.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 15s node genesis/test.mjs
      - name: Locate first exact frontier difference
        run: timeout 90s node experiments/magma-pair-first-diff.mjs
