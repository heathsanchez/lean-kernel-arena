name: MDA Arena qualification
on:
  push:
    branches: [mda-arena-qualification-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Core and arithmetic regressions
        run: |
          node genesis/test.mjs
          node --test genesis/*.test.mjs
      - name: Retrieve public Arena corpus
        run: |
          mkdir -p _build/tests
          curl --fail --location --retry 3 https://arena.lean-lang.org/lean-arena-tests.tar.gz -o /tmp/arena.tar.gz
          sha256sum /tmp/arena.tar.gz
          python3 - <<'PY'
          import tarfile,pathlib,json,hashlib
          root=pathlib.Path('_build/tests')
          rows=[]
          with tarfile.open('/tmp/arena.tar.gz','r:gz') as archive:
              for m in archive:
                  if not m.isfile() or not m.name.endswith('.ndjson'): continue
                  parts=pathlib.PurePosixPath(m.name).parts
                  group=next((i for i,x in enumerate(parts) if x in ('good','bad')),None)
                  if group is None: continue
                  name=pathlib.PurePosixPath(*parts[group+1:])
                  if name.is_absolute() or '..' in name.parts: raise ValueError(m.name)
                  data=archive.extractfile(m).read()
                  path=root/name
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(data)
                  rows.append(dict(name=str(name),expected='ACCEPT' if parts[group]=='good' else 'REJECT',bytes=len(data),sha256=hashlib.sha256(data).hexdigest()))
          (root/'manifest.json').write_text(json.dumps(rows,indent=2))
          print(json.dumps(dict(total=len(rows),giants=[r for r in rows if r['name'] in ('init-prelude.ndjson','perf/grind-ring-5.ndjson','perf/shared-subterm.ndjson')]),indent=2))
          PY
      - name: Require correct verdicts on every public corpus case
        run: node genesis/qualify-corpus.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arena-qualification-witnesses
          path: |
            _build/tests
            genesis/evidence
          retention-days: 7
