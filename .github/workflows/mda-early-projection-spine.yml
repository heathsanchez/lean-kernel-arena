name: MDA early projection spine
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/early-projection-spine.mjs'
      - '.github/workflows/mda-early-projection-spine.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  separate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 15s node genesis/test.mjs
      - name: Test early projection spine congruence
        run: timeout 240s node experiments/early-projection-spine.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: early-projection-spine-${{ github.sha }}
          path: genesis/evidence/early-projection-spine.json
          if-no-files-found: warn
