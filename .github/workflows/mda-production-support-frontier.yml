name: MDA production support frontier
on:
  push:
    branches: [mda-arena-qualification-v1]
    paths:
      - 'genesis/support-metadata-layer.mjs'
      - 'genesis/exact-binder-transport-layer.mjs'
      - 'genesis/production.mjs'
      - 'genesis/production-support-frontier.mjs'
      - '.github/workflows/mda-production-support-frontier.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        budget: [1000000, 2000000, 4000000]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Retrieve giant witnesses from frozen public corpus
        run: |
          mkdir -p _build/tests/perf
          curl --fail --location --retry 3 https://arena.lean-lang.org/lean-arena-tests.tar.gz -o /tmp/arena.tar.gz
          python3 - <<'PY'
          import tarfile,pathlib
          wanted={'init-prelude.ndjson','perf/grind-ring-5.ndjson','perf/shared-subterm.ndjson'}
          root=pathlib.Path('_build/tests')
          found=set()
          with tarfile.open('/tmp/arena.tar.gz','r:gz') as archive:
              for m in archive:
                  if not m.isfile() or not m.name.endswith('.ndjson'): continue
                  parts=pathlib.PurePosixPath(m.name).parts
                  group=next((i for i,x in enumerate(parts) if x in ('good','bad')),None)
                  if group is None: continue
                  name=str(pathlib.PurePosixPath(*parts[group+1:]))
                  if name not in wanted: continue
                  data=archive.extractfile(m).read()
                  path=root/name
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(data)
                  found.add(name)
          missing=wanted-found
          if missing: raise SystemExit('missing witnesses: '+repr(sorted(missing)))
          print('restored',sorted(found))
          PY
      - name: Measure production support contraction
        env:
          BUDGET: ${{ matrix.budget }}
        run: node --stack-size=32768 genesis/production-support-frontier.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-support-frontier-${{ matrix.budget }}-${{ github.sha }}
          path: genesis/evidence/production-support-frontier-${{ matrix.budget }}.json
          if-no-files-found: error
