name: MDA binder-aware LocalDef normalization thresholds
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/pair-binder-aware-localdef-normal-thresholds.mjs'
      - '.github/workflows/mda-pair-binder-aware-localdef-normal-thresholds.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 20s node genesis/test.mjs
      - name: Extend binder-aware LocalDef normalization thresholds
        run: timeout 840s node experiments/pair-binder-aware-localdef-normal-thresholds.mjs
