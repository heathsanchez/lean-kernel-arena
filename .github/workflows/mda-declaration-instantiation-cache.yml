name: MDA declaration instantiation cache
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/declaration-instantiation-cache.mjs'
      - '.github/workflows/mda-declaration-instantiation-cache.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 15s node genesis/test.mjs
      - name: Replay exact declaration instantiation reuse
        run: timeout 150s node experiments/declaration-instantiation-cache.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mda-declaration-instantiation-cache-${{ github.sha }}
          path: genesis/evidence/declaration-instantiation-cache.json
          if-no-files-found: warn
