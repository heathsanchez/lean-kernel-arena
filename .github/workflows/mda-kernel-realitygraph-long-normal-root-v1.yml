name: MDA Kernel RealityGraph long normal root
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/kernel-realitygraph-long-normal-root-v1.mjs'
      - '.github/workflows/mda-kernel-realitygraph-long-normal-root-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 20s node genesis/test.mjs
      - name: Capture long-running normalization root
        run: timeout 660s node experiments/kernel-realitygraph-long-normal-root-v1.mjs
