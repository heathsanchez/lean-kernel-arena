name: Succ le succ scoped localdef WHNF cache V1

on:
  push:
    branches: [mda-succ-le-succ-scoped-localdef-whnf-cache-v1]
    paths:
      - 'genesis/succ-le-succ-scoped-localdef-whnf-cache-v1.mjs'
      - '.github/workflows/mda-succ-le-succ-scoped-localdef-whnf-cache-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Protect core regressions
        run: |
          node genesis/test.mjs
          node --test genesis/*.test.mjs

      - name: Retrieve current public Arena corpus
        run: |
          mkdir -p _build/tests
          curl --fail --location --retry 3 https://arena.lean-lang.org/lean-arena-tests.tar.gz -o /tmp/arena.tar.gz
          python3 - <<'PY'
          import tarfile,pathlib,json,hashlib
          root=pathlib.Path('_build/tests')
          rows=[]
          with tarfile.open('/tmp/arena.tar.gz','r:gz') as archive:
              for m in archive:
                  if not m.isfile() or not m.name.endswith('.ndjson'): continue
                  parts=pathlib.PurePosixPath(m.name).parts
                  group=next((i for i,x in enumerate(parts) if x in ('good','bad')),None)
                  if group is None: continue
                  name=pathlib.PurePosixPath(*parts[group+1:])
                  if name.is_absolute() or '..' in name.parts: raise ValueError(m.name)
                  data=archive.extractfile(m).read()
                  path=root/name
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(data)
                  rows.append(dict(name=str(name),expected='ACCEPT' if parts[group]=='good' else 'REJECT',bytes=len(data),sha256=hashlib.sha256(data).hexdigest()))
          (root/'manifest.json').write_text(json.dumps(rows,indent=2))
          print('ARENA_CASES='+str(len(rows)))
          PY

      - name: Run frozen scoped-cache tournament
        run: |
          node --stack-size=32768 genesis/succ-le-succ-scoped-localdef-whnf-cache-v1.mjs             | tee /tmp/succ-le-succ-scoped-localdef-whnf-cache-v1.log
          grep -q PASS_SUCC_LE_SUCC_SCOPED_LOCALDEF_WHNF_CACHE_V1             /tmp/succ-le-succ-scoped-localdef-whnf-cache-v1.log

      - name: Gate prospective result
        run: |
          python3 - <<'PY'
          import json
          p='genesis/evidence/succ-le-succ-scoped-localdef-whnf-cache-v1.json'
          r=json.load(open(p))
          assert r['schema']=='succ-le-succ-scoped-localdef-whnf-cache-v1'
          assert all(r['gates'].values()),r['gates']
          assert r['precommit']['realitygraph_precommit_commit']=='7a2806d8efa5b1b018c1adeb53bffbab6f2dbe54'
          assert r['economic_status'] in {'ACTIVE','RESERVE'}
          print('PASS_SUCC_LE_SUCC_SCOPED_LOCALDEF_WHNF_CACHE_V1')
          print('ECONOMIC_STATUS='+r['economic_status'])
          print(json.dumps(r['comparison'],indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: succ-le-succ-scoped-localdef-whnf-cache-v1
          path: |
            genesis/evidence/succ-le-succ-scoped-localdef-whnf-cache-v1.json
            /tmp/succ-le-succ-scoped-localdef-whnf-cache-v1.log
          if-no-files-found: error
