name: Nat le transition quotient diagnostic V1

on:
  push:
    branches: [mda-nat-le-transition-quotient-diagnostic-v1]
    paths:
      - 'genesis/nat-le-transition-quotient-diagnostic-v1.mjs'
      - '.github/workflows/mda-nat-le-transition-quotient-diagnostic-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Protect core regressions
        run: |
          node genesis/test.mjs
          node --test genesis/*.test.mjs

      - name: Retrieve current public Arena corpus
        run: |
          mkdir -p _build/tests
          curl --fail --location --retry 3 https://arena.lean-lang.org/lean-arena-tests.tar.gz -o /tmp/arena.tar.gz
          python3 - <<'PY'
          import tarfile,pathlib
          root=pathlib.Path('_build/tests')
          with tarfile.open('/tmp/arena.tar.gz','r:gz') as archive:
              for m in archive:
                  if not m.isfile() or not m.name.endswith('.ndjson'): continue
                  parts=pathlib.PurePosixPath(m.name).parts
                  group=next((i for i,x in enumerate(parts) if x in ('good','bad')),None)
                  if group is None: continue
                  name=pathlib.PurePosixPath(*parts[group+1:])
                  if name.is_absolute() or '..' in name.parts: raise ValueError(m.name)
                  data=archive.extractfile(m).read()
                  path=root/name
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(data)
          PY

      - name: Run frozen Nat.le transition diagnostic
        run: |
          node --stack-size=32768 genesis/nat-le-transition-quotient-diagnostic-v1.mjs             | tee /tmp/nat-le-transition-quotient-diagnostic-v1.log
          grep -q PASS_NAT_LE_TRANSITION_QUOTIENT_DIAGNOSTIC_V1             /tmp/nat-le-transition-quotient-diagnostic-v1.log

      - name: Gate transition evidence
        run: |
          python3 - <<'PY'
          import json
          p='genesis/evidence/nat-le-transition-quotient-diagnostic-v1.json'
          r=json.load(open(p))
          assert r['schema']=='nat-le-transition-quotient-diagnostic-v1'
          assert all(r['gates'].values()),r['gates']
          assert r['precommit']['realitygraph_commit']=='2c01cb013734253ade4129fa4728b64f6f33d164'
          assert r['classification'] in {
              'quotient-and-direct-transition-candidate',
              'quotient-candidate-only',
              'no-candidate'
          }
          print('PASS_NAT_LE_TRANSITION_QUOTIENT_DIAGNOSTIC_V1')
          print('CLASSIFICATION='+r['classification'])
          for row in r['rows']:
              print(row['name'],{
                  'target_calls':row['target_calls'],
                  'sampled':row['sampled'],
                  'classes':row['transition_class_count'],
                  'top8_coverage':row['top8_coverage'],
                  'dominant_count':row['dominant_transition_count'],
                  'dominant_output_head':row['dominant_output_head'],
              })
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nat-le-transition-quotient-diagnostic-v1
          path: |
            genesis/evidence/nat-le-transition-quotient-diagnostic-v1.json
            /tmp/nat-le-transition-quotient-diagnostic-v1.log
          if-no-files-found: error
