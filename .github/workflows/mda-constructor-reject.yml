name: MDA constructor reject separator
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/constructor-reject-spine.mjs'
      - '.github/workflows/mda-constructor-reject.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  separate:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 15s node genesis/test.mjs
      - name: Test constructor-local negative consequence
        run: timeout 150s node experiments/constructor-reject-spine.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mda-constructor-reject-${{ github.sha }}
          path: genesis/evidence/constructor-reject-spine.json
          if-no-files-found: warn
