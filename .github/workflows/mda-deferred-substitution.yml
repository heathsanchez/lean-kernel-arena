name: MDA deferred substitution separator
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'genesis/deferred-substitution.mjs'
      - '.github/workflows/mda-deferred-substitution.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  separate:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct frozen retained present
        run: timeout 15s node genesis/test.mjs
      - name: Test persistent environment WHNF
        run: timeout 120s node --stack-size=32768 genesis/deferred-substitution.mjs
      - name: Preserve separator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mda-deferred-substitution-${{ github.sha }}
          path: genesis/evidence/deferred-substitution.json
          if-no-files-found: warn
