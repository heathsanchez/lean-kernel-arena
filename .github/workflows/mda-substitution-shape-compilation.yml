name: MDA substitution shape compilation

on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/substitution-shape-compilation.mjs'
      - '.github/workflows/mda-substitution-shape-compilation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focus:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build shared-subterm witness
        shell: 'nix develop -c bash -euxo pipefail {0}'
        run: ./lka.py build-test perf/shared-subterm
      - name: Test exact substitution-shape compilation
        run: timeout 180s node --stack-size=32768 experiments/substitution-shape-compilation.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: substitution-shape-compilation-${{ github.sha }}
          path: genesis/evidence/substitution-shape-compilation.json
          if-no-files-found: error
