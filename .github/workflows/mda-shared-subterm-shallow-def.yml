name: MDA shared-subterm shallow definition conversion
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'genesis/shared-subterm-shallow-def-conversion.mjs'
      - '.github/workflows/mda-shared-subterm-shallow-def.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconstruct retained present
        run: timeout 30s node --stack-size=32768 genesis/test.mjs
      - name: Build complete CI Arena set
        shell: 'nix develop -c bash -euxo pipefail {0}'
        run: ./lka.py build-test --skip-ci
      - name: Test shallow definition conversion
        run: timeout 300s node --stack-size=32768 genesis/shared-subterm-shallow-def-conversion.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-subterm-shallow-def-${{ github.sha }}
          path: genesis/evidence/shared-subterm-shallow-def-conversion.json
          if-no-files-found: error
