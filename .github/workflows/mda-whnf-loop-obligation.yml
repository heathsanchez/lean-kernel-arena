name: MDA WHNF loop obligation
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/pair-whnf-loop-obligation.mjs'
      - '.github/workflows/mda-whnf-loop-obligation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 20s node genesis/test.mjs
      - name: Capture equality behind WHNF loop
        run: timeout 420s node experiments/pair-whnf-loop-obligation.mjs
