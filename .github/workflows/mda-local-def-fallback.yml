name: MDA local-definition fallback separator
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'genesis/local-def-fallback.mjs'
      - '.github/workflows/mda-local-def-fallback.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  separate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 15s node genesis/test.mjs
      - name: Test retained-first exact local-definition fallback
        run: timeout 240s node genesis/local-def-fallback.mjs
      - name: Preserve separator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mda-local-def-fallback-${{ github.sha }}
          path: genesis/evidence/local-def-fallback.json
          if-no-files-found: warn
