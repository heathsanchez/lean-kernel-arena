name: MDA binder callpath atlas
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'genesis/binder-callpaths.mjs'
      - '.github/workflows/mda-binder-callpaths.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct frozen retained present
        run: timeout 15s node genesis/test.mjs
      - name: Attribute shift/substitute work to immediate callers
        run: timeout 120s node --stack-size=32768 genesis/binder-callpaths.mjs
      - name: Preserve callpath atlas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mda-binder-callpaths-${{ github.sha }}
          path: genesis/evidence/binder-callpaths.json
          if-no-files-found: warn
