name: MDA bidirectional LocalDef lambda
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/bidir-localdef-lambda.mjs'
      - '.github/workflows/mda-bidir-localdef-lambda.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  separate:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 20s node genesis/test.mjs
      - name: Test bidirectional LocalDef lambda checking
        run: timeout 300s node experiments/bidir-localdef-lambda.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bidir-localdef-lambda-${{ github.sha }}
          path: genesis/evidence/bidir-localdef-lambda.json
          if-no-files-found: warn
