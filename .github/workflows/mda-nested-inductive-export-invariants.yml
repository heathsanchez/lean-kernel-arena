name: MDA nested inductive export invariants
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/nested-inductive-export-invariants.mjs'
      - '.github/workflows/mda-nested-inductive-export-invariants.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build oversized witnesses
        shell: 'nix develop -c bash -euxo pipefail {0}'
        run: |
          ./lka.py build-test init-prelude
          ./lka.py build-test perf/grind-ring-5
      - name: Inspect nested export invariants
        run: node experiments/nested-inductive-export-invariants.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nested-inductive-export-invariants-${{ github.sha }}
          path: genesis/evidence/nested-inductive-export-invariants.json
          if-no-files-found: error
