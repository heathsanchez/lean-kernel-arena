name: MDA combined magma pair execution
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/pair-combined-execution.mjs'
      - '.github/workflows/mda-pair-combined-execution.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 20s node genesis/test.mjs
      - name: Measure combined pair execution
        run: timeout 360s node experiments/pair-combined-execution.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pair-combined-execution-${{ github.sha }}
          path: genesis/evidence/pair-combined-execution.json
          if-no-files-found: warn
