name: Substitute consequence accounting V1

on:
  push:
    branches: [mda-substitute-consequence-accounting-v1]
    paths:
      - 'genesis/substitute-consequence-accounting-v1.mjs'
      - '.github/workflows/mda-substitute-consequence-accounting-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Protect core regressions
        run: |
          node genesis/test.mjs
          node --test genesis/*.test.mjs

      - name: Retrieve current public Arena corpus
        run: |
          mkdir -p _build/tests
          curl --fail --location --retry 3 https://arena.lean-lang.org/lean-arena-tests.tar.gz -o /tmp/arena.tar.gz
          python3 - <<'PY'
          import tarfile,pathlib
          root=pathlib.Path('_build/tests')
          with tarfile.open('/tmp/arena.tar.gz','r:gz') as archive:
              for m in archive:
                  if not m.isfile() or not m.name.endswith('.ndjson'): continue
                  parts=pathlib.PurePosixPath(m.name).parts
                  group=next((i for i,x in enumerate(parts) if x in ('good','bad')),None)
                  if group is None: continue
                  name=pathlib.PurePosixPath(*parts[group+1:])
                  if name.is_absolute() or '..' in name.parts: raise ValueError(m.name)
                  data=archive.extractfile(m).read()
                  path=root/name
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(data)
          PY

      - name: Run substitution consequence accounting
        run: |
          node --stack-size=32768 genesis/substitute-consequence-accounting-v1.mjs             | tee /tmp/substitute-consequence-accounting-v1.log
          grep -q PASS_SUBSTITUTE_CONSEQUENCE_ACCOUNTING_V1             /tmp/substitute-consequence-accounting-v1.log

      - name: Gate accounting evidence
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('genesis/evidence/substitute-consequence-accounting-v1.json'))
          assert r['schema']=='substitute-consequence-accounting-v1'
          assert all(r['gates'].values()),r['gates']
          assert r['precommit']['realitygraph_commit']=='2a147eb014986b07d53b6d70b012837235fa514e'
          assert r['classification'] in {'input-reuse-saturated','input-reuse-sparse','mixed'}
          print('PASS_SUBSTITUTE_CONSEQUENCE_ACCOUNTING_V1')
          print('CLASSIFICATION='+r['classification'])
          for row in r['rows']:
              print(row['name'],{
                  'substitution_reuse_ratio':row['substitution_reuse_ratio'],
                  'binder_stats':row['binder_stats'],
                  'compiled_node_hits':row['compiled_node_hits'],
                  'compiled_spine_hits':row['compiled_spine_hits'],
                  'allocations':row['allocations'],
                  'semantic_cache_stats':row['semantic_cache_stats'],
              })
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: substitute-consequence-accounting-v1
          path: |
            genesis/evidence/substitute-consequence-accounting-v1.json
            /tmp/substitute-consequence-accounting-v1.log
          if-no-files-found: error
