name: MDA recursive definition shallow focus
on:
  push:
    branches:
      - mda-kernel-genesis-v1
    paths:
      - genesis/recursive-def-shallow-conversion-layer.mjs
      - genesis/recursive-def-shallow-focus.mjs
      - .github/workflows/mda-recursive-def-shallow-focus.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Build focused witnesses
        shell: 'nix develop -c bash -euxo pipefail {0}'
        run: |
          ./lka.py build-test perf/shared-subterm
          ./lka.py build-test perf/church-numerals
          ./lka.py build-test perf/args-before-unfold
          ./lka.py build-test perf/folded-constant-first
          ./lka.py build-test perf/repeated-subproblem
          ./lka.py build-test perf/discarded-argument-match
          ./lka.py build-test undecidability/alg-conv-trans-acc-left
          ./lka.py build-test undecidability/alg-conv-trans-acc-right
          ./lka.py build-test undecidability/subject-reduction-redex
          ./lka.py build-test undecidability/alg-conv-trans-acc
          ./lka.py build-test undecidability/subject-reduction-reduct
      - name: Run shallow recursive definition conversion
        run: timeout 180s node --stack-size=32768 genesis/recursive-def-shallow-focus.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recursive-def-shallow-focus-evidence
          path: genesis/evidence/recursive-def-shallow-focus.json
          if-no-files-found: error
