name: MDA localdef WHNF identity triple cache V1

on:
  push:
    branches: [mda-localdef-whnf-identity-triple-cache-v1]
    paths:
      - 'genesis/localdef-whnf-identity-triple-cache-v1.mjs'
      - '.github/workflows/mda-localdef-whnf-identity-triple-cache-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Protect core regressions
        run: |
          node genesis/test.mjs
          node --test genesis/*.test.mjs

      - name: Retrieve current public Arena corpus
        run: |
          mkdir -p _build/tests
          curl --fail --location --retry 3 https://arena.lean-lang.org/lean-arena-tests.tar.gz -o /tmp/arena.tar.gz
          python3 - <<'PY'
          import tarfile,pathlib,json,hashlib
          root=pathlib.Path('_build/tests')
          rows=[]
          with tarfile.open('/tmp/arena.tar.gz','r:gz') as archive:
              for m in archive:
                  if not m.isfile() or not m.name.endswith('.ndjson'): continue
                  parts=pathlib.PurePosixPath(m.name).parts
                  group=next((i for i,x in enumerate(parts) if x in ('good','bad')),None)
                  if group is None: continue
                  name=pathlib.PurePosixPath(*parts[group+1:])
                  if name.is_absolute() or '..' in name.parts: raise ValueError(m.name)
                  data=archive.extractfile(m).read()
                  path=root/name
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(data)
                  rows.append(dict(name=str(name),expected='ACCEPT' if parts[group]=='good' else 'REJECT',bytes=len(data),sha256=hashlib.sha256(data).hexdigest()))
          (root/'manifest.json').write_text(json.dumps(rows,indent=2))
          print('ARENA_CASES='+str(len(rows)))
          PY

      - name: Run identity-triple cache tournament
        run: |
          node --stack-size=32768 genesis/localdef-whnf-identity-triple-cache-v1.mjs             | tee /tmp/localdef-whnf-identity-triple-cache-v1.log
          grep -q PASS_LOCALDEF_WHNF_IDENTITY_TRIPLE_CACHE_V1             /tmp/localdef-whnf-identity-triple-cache-v1.log

      - name: Gate semantic and economic result
        run: |
          python3 - <<'PY'
          import json
          p='genesis/evidence/localdef-whnf-identity-triple-cache-v1.json'
          r=json.load(open(p))
          assert r['schema']=='localdef-whnf-identity-triple-cache-v1'
          assert all(r['gates'].values()),r['gates']
          assert r['comparison']['fast_hits']>200000
          assert r['comparison']['restart_fast_hits']>200000
          assert r['comparison']['fast_elapsed_ms']<r['comparison']['string_elapsed_ms']
          print('PASS_LOCALDEF_WHNF_IDENTITY_TRIPLE_CACHE_V1')
          print(json.dumps(r['comparison'],indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: localdef-whnf-identity-triple-cache-v1
          path: |
            genesis/evidence/localdef-whnf-identity-triple-cache-v1.json
            /tmp/localdef-whnf-identity-triple-cache-v1.log
          if-no-files-found: error
