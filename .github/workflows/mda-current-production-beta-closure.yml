name: MDA current production beta closure separator

on:
  push:
    branches: [mda-arena-qualification-v1]
    paths:
      - 'genesis/current-production-beta-closure-separator.mjs'
      - '.github/workflows/mda-current-production-beta-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  separator:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        budget: [2000000, 4000000, 8000000]
    env:
      BUDGET: ${{ matrix.budget }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch frozen Arena targets
        run: |
          mkdir -p _build/tests/perf
          curl --fail --location --retry 3 https://arena.lean-lang.org/lean-arena-tests.tar.gz -o /tmp/arena.tar.gz
          echo 'f915a7c0e688bbdcbb117e4fbb8cbe26c1ad4388da7712dea641bc6041b3e8bc  /tmp/arena.tar.gz' | sha256sum -c -
          python3 - <<'PY'
          import tarfile,pathlib
          wanted={
            'init-prelude.ndjson':'_build/tests/init-prelude.ndjson',
            'perf/grind-ring-5.ndjson':'_build/tests/perf/grind-ring-5.ndjson',
            'perf/shared-subterm.ndjson':'_build/tests/perf/shared-subterm.ndjson',
          }
          with tarfile.open('/tmp/arena.tar.gz','r:gz') as a:
            for m in a:
              if not m.isfile(): continue
              for suffix,out in wanted.items():
                if m.name.endswith('good/'+suffix):
                  p=pathlib.Path(out);p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_bytes(a.extractfile(m).read())
          for p in wanted.values():
            if not pathlib.Path(p).exists(): raise SystemExit('missing '+p)
          PY
      - name: Run current production beta closure separator
        run: timeout 480s node --stack-size=32768 genesis/current-production-beta-closure-separator.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-beta-closure-${{ matrix.budget }}-${{ github.sha }}
          path: genesis/evidence/current-beta-closure-${{ matrix.budget }}.json
          if-no-files-found: warn
