name: MDA normal root profile

on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'genesis/normal-root-profile.mjs'
      - '.github/workflows/mda-normal-root-profile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - id: giant-cache
        name: Restore giant witnesses
        uses: actions/cache/restore@v4
        with:
          path: |
            _build/tests/init-prelude.ndjson
            _build/tests/perf/grind-ring-5.ndjson
          key: giant-frontier-e00d4ce4fb0fa667f632e624adbbc2e6a42704db0556aaf2f154e50f6e450aca
      - if: steps.giant-cache.outputs.cache-hit != 'true'
        uses: cachix/install-nix-action@v31
      - if: steps.giant-cache.outputs.cache-hit != 'true'
        name: Rebuild giant witnesses
        shell: 'nix develop -c bash -euxo pipefail {0}'
        run: |
          ./lka.py build-test init-prelude
          ./lka.py build-test perf/grind-ring-5
      - if: steps.giant-cache.outputs.cache-hit != 'true'
        name: Save giant witnesses
        uses: actions/cache/save@v4
        with:
          path: |
            _build/tests/init-prelude.ndjson
            _build/tests/perf/grind-ring-5.ndjson
          key: giant-frontier-e00d4ce4fb0fa667f632e624adbbc2e6a42704db0556aaf2f154e50f6e450aca
      - name: Profile normalization roots
        env:
          MATHGRAPH_INPUT_BYTE_LIMIT: "15000000"
          MATHGRAPH_RECORD_LIMIT: "250000"
        run: node --stack-size=32768 genesis/normal-root-profile.mjs
