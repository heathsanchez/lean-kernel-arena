name: MDA current spine congruence
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/current-spine-congruence.mjs'
      - '.github/workflows/mda-current-spine.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  separate:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 15s node genesis/test.mjs
      - name: Test transactional same-head congruence
        run: timeout 150s node experiments/current-spine-congruence.mjs
      - name: Preserve separator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mda-current-spine-${{ github.sha }}
          path: genesis/evidence/current-spine-congruence.json
          if-no-files-found: warn
