name: MDA binder erasure consequence
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/binder-erasure-consequence.mjs'
      - '.github/workflows/mda-binder-erasure-consequence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  separator:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 20s node genesis/test.mjs
      - name: Test exact application binder erasure
        run: timeout 420s node experiments/binder-erasure-consequence.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mda-binder-erasure-${{ github.sha }}
          path: genesis/evidence/binder-erasure-consequence.json
          if-no-files-found: error
          retention-days: 7
