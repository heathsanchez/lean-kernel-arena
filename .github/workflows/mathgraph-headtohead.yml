name: MathGraph A5 safety ablation

on:
  push:
    branches: [mathgraph-local-headtohead]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mathgraph-a5-safety
  cancel-in-progress: true

jobs:
  focused-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: System info
        run: |
          uname -a
          nproc
          free -h

      - name: Build decisive Arena tests
        run: ./lka.py build-test cedar cslib mathlib std grind-ring-5 init init-prelude
        shell: 'nix develop -c bash -euxo pipefail {0}'

      - name: Build sokonanoda
        run: ./lka.py build-checker sokonanoda
        shell: 'nix develop -c bash -euxo pipefail {0}'

      - name: Build MathGraph A5
        run: ./lka.py build-checker mathgraph-a5
        shell: 'nix develop -c bash -euxo pipefail {0}'

      - name: Run sokonanoda focused set
        run: ./lka.py run --checker sokonanoda --test cedar --test cslib --test mathlib --test std --test grind-ring-5 --test init --test init-prelude
        shell: 'nix develop -c bash -euxo pipefail {0}'

      - name: Run MathGraph A5 focused set
        run: ./lka.py run --checker mathgraph-a5 --test cedar --test cslib --test mathlib --test std --test grind-ring-5 --test init --test init-prelude
        shell: 'nix develop -c bash -euxo pipefail {0}'

      - name: Build comparative site
        run: ./lka.py build-site
        shell: 'nix develop -c bash -euxo pipefail {0}'

      - name: Upload comparison
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mathgraph-a5-safety
          path: |
            _out
            _build/results
          if-no-files-found: warn
