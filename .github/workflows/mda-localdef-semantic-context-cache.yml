name: MDA LocalDef semantic context cache
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/localdef-semantic-context-cache.mjs'
      - '.github/workflows/mda-localdef-semantic-context-cache.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  separate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 20s node genesis/test.mjs
      - name: Test LocalDef semantic context consequence keys
        run: timeout 420s node experiments/localdef-semantic-context-cache.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localdef-semantic-context-cache-${{ github.sha }}
          path: genesis/evidence/localdef-semantic-context-cache.json
          if-no-files-found: warn
