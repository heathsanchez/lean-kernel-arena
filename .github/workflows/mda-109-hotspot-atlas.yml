name: MDA 109-state hotspot atlas
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - '.github/workflows/mda-109-hotspot-atlas.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 15s node genesis/test.mjs
      - name: Profile current 109-state residuals
        run: timeout 240s node experiments/current-hotspot-atlas.mjs
      - name: Preserve hotspot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mda-109-hotspot-atlas-${{ github.sha }}
          path: genesis/evidence/current-hotspot-atlas.json
          if-no-files-found: warn
