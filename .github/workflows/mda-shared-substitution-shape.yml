name: MDA shared substitution shape
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/shared-substitution-shape.mjs'
      - '.github/workflows/mda-shared-substitution-shape.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 20s node genesis/test.mjs
      - name: Profile shared-subterm substitution identities
        run: timeout 240s node experiments/shared-substitution-shape.mjs
