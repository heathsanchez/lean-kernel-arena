name: MDA pair support slice
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/pair-support-slice.mjs'
      - '.github/workflows/mda-pair-support-slice.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 20s node genesis/test.mjs
      - name: Measure residual inference support
        run: timeout 540s node experiments/pair-support-slice.mjs
