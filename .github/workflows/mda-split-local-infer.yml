name: MDA split local inference
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/split-local-infer.mjs'
      - '.github/workflows/mda-split-local-infer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  separate:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 15s node genesis/test.mjs
      - name: Test split ordinary and local inference execution
        run: timeout 150s node experiments/split-local-infer.mjs
      - name: Preserve separator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mda-split-local-infer-${{ github.sha }}
          path: genesis/evidence/split-local-infer.json
          if-no-files-found: warn
