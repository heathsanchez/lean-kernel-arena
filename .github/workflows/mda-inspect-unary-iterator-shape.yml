name: MDA inspect unary iterator shape
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'genesis/inspect-unary-iterator-shape.mjs'
      - '.github/workflows/mda-inspect-unary-iterator-shape.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Restore shared-subterm witness
        id: shared-cache
        uses: actions/cache/restore@v4
        with:
          path: _build/tests/perf/shared-subterm.ndjson
          key: shared-subterm-${{ hashFiles('tests/perf/shared-subterm.lean') }}
      - name: Build shared-subterm
        if: steps.shared-cache.outputs.cache-hit != 'true'
        shell: 'nix develop -c bash -euxo pipefail {0}'
        run: ./lka.py build-test perf/shared-subterm
      - name: Inspect iterator shape
        run: node --stack-size=32768 genesis/inspect-unary-iterator-shape.mjs
