name: MDA focused stack frontier
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/stack-frontier-replay.mjs'
      - '.github/workflows/mda-stack-frontier.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 15s node genesis/test.mjs
      - name: Replay focused stack frontier
        run: timeout 120s node experiments/stack-frontier-replay.mjs
