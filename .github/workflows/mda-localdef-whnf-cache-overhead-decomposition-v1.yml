name: Localdef WHNF cache overhead decomposition V1

on:
  push:
    branches: [mda-localdef-whnf-cache-overhead-decomposition-v1]
    paths:
      - 'genesis/localdef-whnf-cache-overhead-decomposition-v1.mjs'
      - '.github/workflows/mda-localdef-whnf-cache-overhead-decomposition-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Protect core regressions
        run: |
          node genesis/test.mjs
          node --test genesis/*.test.mjs

      - name: Retrieve current public Arena corpus
        run: |
          mkdir -p _build/tests
          curl --fail --location --retry 3 https://arena.lean-lang.org/lean-arena-tests.tar.gz -o /tmp/arena.tar.gz
          python3 - <<'PY'
          import tarfile,pathlib,json
          root=pathlib.Path('_build/tests')
          with tarfile.open('/tmp/arena.tar.gz','r:gz') as archive:
              for m in archive:
                  if not m.isfile() or not m.name.endswith('.ndjson'): continue
                  parts=pathlib.PurePosixPath(m.name).parts
                  group=next((i for i,x in enumerate(parts) if x in ('good','bad')),None)
                  if group is None: continue
                  name=pathlib.PurePosixPath(*parts[group+1:])
                  if name.is_absolute() or '..' in name.parts: raise ValueError(m.name)
                  data=archive.extractfile(m).read()
                  path=root/name
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(data)
          PY

      - name: Run frozen overhead decomposition
        run: |
          node --stack-size=32768 genesis/localdef-whnf-cache-overhead-decomposition-v1.mjs             | tee /tmp/localdef-whnf-cache-overhead-decomposition-v1.log
          grep -q PASS_LOCALDEF_WHNF_CACHE_OVERHEAD_DECOMPOSITION_V1             /tmp/localdef-whnf-cache-overhead-decomposition-v1.log

      - name: Gate diagnostic classification
        run: |
          python3 - <<'PY'
          import json
          p='genesis/evidence/localdef-whnf-cache-overhead-decomposition-v1.json'
          r=json.load(open(p))
          assert r['schema']=='localdef-whnf-cache-overhead-decomposition-v1'
          assert all(r['gates'].values()),r['gates']
          assert r['precommit']['realitygraph_commit']=='596038b0d96fcda4780056be10bc69766bbcdaf7'
          assert r['next_route'] in {
              'promote-scoped-cache',
              'reduce-cache-lookup-overhead',
              'pivot-away-from-whnf-memoization'
          }
          print('PASS_LOCALDEF_WHNF_CACHE_OVERHEAD_DECOMPOSITION_V1')
          print('NEXT_ROUTE='+r['next_route'])
          print(json.dumps({
              'totals_ms':r['totals_ms'],
              'deltas_ms':r['deltas_ms'],
              'classification':r['classification'],
          },indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: localdef-whnf-cache-overhead-decomposition-v1
          path: |
            genesis/evidence/localdef-whnf-cache-overhead-decomposition-v1.json
            /tmp/localdef-whnf-cache-overhead-decomposition-v1.log
          if-no-files-found: error
