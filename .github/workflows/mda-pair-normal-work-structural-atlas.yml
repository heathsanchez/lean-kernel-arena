name: MDA LocalDef normal structural atlas
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'experiments/pair-normal-work-structural-atlas.mjs'
      - '.github/workflows/mda-pair-normal-work-structural-atlas.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct retained present
        run: timeout 20s node genesis/test.mjs
      - name: Measure structural duplication inside LocalDef normal worklist
        run: timeout 660s node experiments/pair-normal-work-structural-atlas.mjs
