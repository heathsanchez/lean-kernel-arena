name: MDA recursor core hotspot fast
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'genesis/recursor-core-first-hotspot.mjs'
      - 'genesis/recursor-core-first-layer.mjs'
      - 'genesis/compiled-dynamic-slot-layer.mjs'
      - '.github/workflows/mda-recursor-core-hotspot-fast.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hotspot:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Build shared witness
        shell: 'nix develop -c bash -euxo pipefail {0}'
        run: ./lka.py build-test perf/shared-subterm
      - name: Profile candidate
        run: timeout 180s node --stack-size=32768 genesis/recursor-core-first-hotspot.mjs
