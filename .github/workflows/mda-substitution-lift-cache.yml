name: MDA substitution lift-cache separator
on:
  push:
    branches: [mda-kernel-genesis-v1]
    paths:
      - 'genesis/substitution-lift-cache.mjs'
      - '.github/workflows/mda-substitution-lift-cache.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  separate:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct frozen retained present
        run: timeout 15s node genesis/test.mjs
      - name: Test origin-forced local lift reuse
        run: timeout 120s node --stack-size=32768 genesis/substitution-lift-cache.mjs
      - name: Preserve separator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mda-substitution-lift-cache-${{ github.sha }}
          path: genesis/evidence/substitution-lift-cache.json
          if-no-files-found: warn
